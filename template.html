<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoIndex</title>
<!-- SheetJS：车型库 Excel 导入/导出/模板下载 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f6;color:#2c2c2a;font-size:14px;line-height:1.6;padding:0}
  .card{background:#fff;border:1px solid #e3e2dc;border-radius:12px;padding:20px}
  /* ===== 侧边栏布局 ===== */
  .layout{display:flex;min-height:100vh}
  .side{width:200px;flex:none;background:#fff;border-right:1px solid #e3e2dc;padding:20px 12px;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto}
  .side-brand{font-size:15.5px;font-weight:600;color:#26215c;padding:0 10px 14px;border-bottom:1px solid #eeece5;margin-bottom:6px;line-height:1.4}
  .side-group{font-size:11px;color:#8a897f;margin:10px 10px 4px;letter-spacing:2px;border-top:1px solid #e8e7e0;padding-top:8px}
  .side-group:first-child{border-top:none;margin-top:4px;padding-top:0}
  .side-item{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:8px;border:none;background:none;cursor:pointer;font-size:13.5px;color:#444441;font-family:inherit;margin-bottom:2px}
  .side-item:hover{background:#f4f3fa;color:#3c3489}
  .side-item.on{background:#eeedfe;color:#3c3489;font-weight:500}
  .main{flex:1;min-width:0;padding:20px 24px}
  .wrap{max-width:1480px;margin:0 auto}
  @media(max-width:760px){
    .layout{flex-direction:column}
    .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #e3e2dc;display:flex;align-items:center;gap:6px;padding:10px 14px;flex-wrap:wrap}
    .side-brand{border:none;padding:0 8px 0 0;margin:0}
    .side-group{display:none}
    .side-item{width:auto;margin:0}
    .main{padding:14px 14px}
  }
  .sub{color:#6b6a66;font-size:13px;margin-top:4px}
  .card{background:#fff;border:1px solid #e3e2dc;border-radius:12px;padding:20px;margin-top:16px}
  .row{display:flex;gap:10px;align-items:stretch}
  input[type=text],textarea{flex:1;border:1px solid #c9c8c0;border-radius:8px;padding:9px 12px;font-size:14px;font-family:Consolas,Menlo,monospace;letter-spacing:1px;outline:none}
  input[type=text]:focus,textarea:focus,select:focus{border-color:#534ab7}
  select{border:1px solid #c9c8c0;border-radius:8px;padding:9px 12px;font-size:14px;background:#fff;outline:none;cursor:pointer}
  .combo{position:relative;flex:1;min-width:240px;display:flex;align-items:center;min-height:28px}
  .combo-input{flex:1;padding:4px 34px 4px 12px !important;height:28px;box-sizing:border-box;font-size:13.5px;line-height:1.4;letter-spacing:1px}
  .combo-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:#d9d7cf;border-radius:50%;color:#5f5e5a;font-size:15px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
  .combo-clear:hover{background:#c2bfb4}
  .combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;max-height:330px;overflow:auto;background:#fff;border:1px solid #c9c8c0;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .combo-item{padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .combo-item:hover{background:#eeedfe}
  .combo-empty{padding:8px 12px;font-size:13px;color:#8a897f}
  .lib-wrap{max-height:540px;overflow:auto;border:1px solid #eeece5;border-radius:8px}
  .lib-wrap table{font-size:12px;width:auto;min-width:100%;table-layout:auto}
  .lib-wrap td{white-space:nowrap;vertical-align:middle}
  .lib-wrap thead th{position:sticky;top:0;z-index:1}
  /* 品类管理：产品名后显示有效产品数（有 CDAP 或 OE） */
  .pm-prod-count{display:inline-block;min-width:16px;text-align:center;background:#eeedfe;color:#534ab7;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:500;margin-left:8px;vertical-align:middle}
  .pm-prod-count.zero{background:#f3f2ee;color:#a7a69e}
  .pm-all{margin-top:18px}
  .pm-all-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .pm-all-title{font-size:14px;font-weight:500;color:#26215c}
  .pm-ops{white-space:nowrap}
  .btn.sm{height:24px;padding:0 12px;font-size:12px;border-radius:7px}
  /* 产品管理：编辑 / 关联车型 弹窗 */
  .pm-modal{position:fixed;inset:0;background:rgba(20,18,40,.38);z-index:70;display:none;align-items:center;justify-content:center}
  .pm-modal.show{display:flex}
  .pm-card{background:#fff;width:min(560px,94vw);max-height:86vh;overflow:auto;border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.24)}
  /* 导出加载遮罩 */
  .export-loading{position:fixed;inset:0;background:rgba(20,18,40,.45);z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column}
  .export-loading.show{display:flex}
  .export-loading .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:exportSpin .8s linear infinite}
  .export-loading .txt{color:#fff;font-size:14px;margin-top:14px;letter-spacing:.5px}
  @keyframes exportSpin{to{transform:rotate(360deg)}}
  .pm-card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eeece5;position:sticky;top:0;background:#fff}
  .pm-card-hd .t{font-size:15px;font-weight:500;color:#26215c}
  .pm-card-hd .t small{color:#8a897f;font-weight:400;margin-left:6px}
  .pm-card-close{border:none;background:#f1efe8;color:#5f5e5a;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:17px;line-height:1;flex:none}
  .pm-card-close:hover{background:#e3e2dc}
  .pm-card-bd{padding:14px 18px 4px}
  .pm-fld{margin-bottom:12px}
  .pm-fld label{display:block;font-size:12px;color:#6b6a64;margin-bottom:4px}
  .pm-fld label b{color:#534ab7}
  .pm-fld input{width:100%;height:32px;border:1px solid #d9d7cf;border-radius:7px;padding:0 10px;font-size:13px;box-sizing:border-box;background:#fff}
  .pm-fld input[readonly]{background:#f6f5f1;color:#9a978d}
  .pm-card-ft{display:flex;justify-content:flex-end;gap:10px;padding:10px 18px 18px}
  .pm-rel-add{display:flex;gap:8px;margin-bottom:14px}
  .pm-rel-add input{flex:1;height:32px;border:1px solid #d9d7cf;border-radius:7px;padding:0 10px;font-size:13px;box-sizing:border-box}
  .pm-rel-list{list-style:none;margin:0;padding:0}
  .pm-rel-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3f2ee}
  .pm-rel-item:last-child{border-bottom:none}
  .pm-rel-vid{font-family:Consolas,monospace;font-size:13px;color:#26215c;background:#eeedfe;border-radius:6px;padding:3px 9px;white-space:nowrap;flex:none}
  .pm-rel-meta{font-size:12px;color:#8a897f;line-height:1.4}
  .pm-rel-meta b{color:#57554d;font-weight:500}
  .pm-rel-owner{font-size:11px;color:#0f6e56;background:#e1f5ee;border-radius:6px;padding:1px 7px;margin-left:6px}
  .pm-rel-remark{font-size:12px;color:#57554d;min-width:100px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
  .pm-rel-act{margin-left:auto;display:flex;gap:4px;flex:none}
  .pm-rel-edit-cell{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .pm-rel-input{flex:1;height:28px;border:1px solid #534ab7;border-radius:6px;padding:0 8px;font-size:12px;box-sizing:border-box;outline:none;min-width:80px}
  .pm-rel-input:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}
  .pm-rel-owner-tag{font-size:11px;color:#534ab7;background:#eeedfe;border-radius:6px;padding:1px 7px;white-space:nowrap;flex:none}
  .pm-rel-unlink-btn{font-size:12px;color:#fff;background:#dc3545;border:1px solid #dc3545;border-radius:4px;padding:2px 8px;cursor:pointer;white-space:nowrap;flex:none}
  .pm-rel-unlink-btn:hover{background:#c82333}
  .pm-rel-empty{color:#8a897f;padding:14px;text-align:center;font-size:13px}
  .pm-msg{font-size:12px;padding:8px 0;color:#854f0b}
  textarea{letter-spacing:1px;min-height:130px;resize:vertical}
  .btn{border:none;border-radius:8px;padding:0 22px;font-size:14px;cursor:pointer;background:#534ab7;color:#fff;white-space:nowrap;height:28px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:background-color .18s ease}
  .btn:hover{background:#3b82f6}
  .btn.ghost{background:#534ab7;color:#fff;border:1px solid #534ab7}
  .btn.ghost:hover{background:#3b82f6;border-color:#3b82f6}
  .hint{font-size:12px;color:#8a897f;margin-top:6px}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
  .b-ok{background:#e1f5ee;color:#0f6e56}
  .b-warn{background:#faeeda;color:#854f0b}
  .b-err{background:#fcebeb;color:#a32d2d}
  .b-info{background:#e6f1fb;color:#185fa5}
  .vinstrip{display:flex;gap:3px;margin:14px 0;flex-wrap:wrap}
  .seg{border-radius:5px;padding:4px 6px;text-align:center;min-width:34px}
  .seg small{display:block;font-size:10px;opacity:.75}
  .seg b{font-size:13px;font-family:monospace;font-weight:600}
  .s-wmi{background:#cecbf6;color:#26215c}
  .s-attr{background:#eeedfe;color:#534ab7}
  .s-chk{background:#f1efe8;color:#5f5e5a}
  .s-year{background:#9fe1cb;color:#085041}
  .s-plant{background:#f1efe8;color:#5f5e5a}
  .s-ser{background:#f1efe8;color:#5f5e5a}
  .result{margin-top:16px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;margin-top:12px}
  .vitem{border-left:3px solid #cecbf6;padding:2px 10px}
  .vitem .k{font-size:12px;color:#8a897f}
  .vitem .v{font-size:13.5px;color:#2c2c2a;font-weight:500;word-break:break-word}
  .cand{border:1px solid #e3e2dc;border-radius:10px;padding:12px 14px;margin-top:10px}
  .cand h4{font-size:13.5px;font-weight:500;color:#26215c;margin-bottom:6px;cursor:default}
  .cand h4.can-toggle{cursor:pointer}
  .cand h4.can-toggle:hover{color:#463da1}
  .chev{font-size:11px;display:inline-block;margin-left:2px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px}
  th{background:#f1efe8;text-align:left;padding:7px 8px;font-weight:500;color:#444441;white-space:nowrap}
  td{border-bottom:1px solid #eeece5;padding:7px 8px;vertical-align:top}
  tr:hover td{background:#fafafa}
  .mono{font-family:Consolas,monospace}
  .stat{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:#6b6a66}
  .stat b{color:#3c3489;font-size:15px;font-weight:500}
  .empty{color:#8a897f;padding:18px;text-align:center;font-size:13px}
  .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px}
  .m-err{background:#fcebeb;color:#791f1f}
  .m-info{background:#e6f1fb;color:#0c447c}
  .title2{font-size:15px;font-weight:500;color:#26215c;line-height:22px}
  /* ===== 车型下关联产品 ===== */
  .prod{margin-top:12px;border-top:1px dashed #e2e0f3;padding-top:10px}
  .prod-h{font-size:12.5px;font-weight:500;color:#26215c;margin-bottom:6px}
  .pgrp{font-size:11px;color:#534ab7;font-weight:600;margin:8px 0 2px}
  .ptab .pgrp-tr td{background:#f7f6f2;color:#534ab7;font-weight:600;font-size:11px;padding:5px 8px;border-bottom:1px solid #e8e5d8;letter-spacing:.5px}
  .ptab{font-size:12px;margin-top:0;margin-bottom:6px}
  #ecardsProds .ptab{table-layout:fixed;width:100%}
  .ptab th{background:#f7f6f2;white-space:nowrap}
  .ptab td{border-bottom:1px solid #f0eee8}
  .pen{color:#8a897f;font-size:11px}
  .pcnt{display:inline-block;padding:1px 8px;border-radius:10px;background:#eef0ff;color:#3c3489;font-size:11px;font-weight:500}
  .ped{border:1px solid #cfcdd4;border-radius:5px;padding:4px 6px;font-size:12px;width:100%;box-sizing:border-box}
  .ped:focus{outline:none;border-color:#534ab7}
  /* ===== 位置枚举复选框 ===== */
  .loc-cbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .loc-cb{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#5f5e5a;cursor:pointer;white-space:nowrap;line-height:1;flex:none}
  .loc-cb input[type=checkbox]{margin:0;cursor:pointer;width:auto;height:auto;flex:none}
  /* ===== 添加产品弹窗下拉 ===== */
  .ap-search-wrap{position:relative}
  .ap-list{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid #cfcdd4;border-radius:6px;max-height:220px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.15);margin-top:2px}
  .ap-opt{padding:6px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f2f1ea}
  .ap-opt:last-child{border-bottom:none}
  .ap-opt:hover{background:#eeedfe}
  .ap-grp{color:#8a897f;font-size:11px;margin-left:6px}
  .ap-empty{padding:6px 10px;color:#8a897f;font-size:12px}
  .ap-sel{font-size:12px;color:#26215c;margin:4px 0 0}
  /* ===== 产品管理（树形结构：品类 → 产品） ===== */
  .cat-code{display:inline-block;min-width:34px;text-align:center;background:#26215c;color:#fff;border-radius:7px;font-weight:600;padding:3px 9px;font-family:Consolas,monospace;font-size:12px}
  .cat-name{font-size:13.5px;font-weight:500;color:#26215c}
  .pm-tree{margin-top:12px}
  .pm-actions{display:flex;gap:8px;align-items:center}
  .pm-addprod{margin-left:auto;padding:2px 9px;font-size:11px}
  .pm-prodform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px 16px;padding:10px;background:#fafaf7;border-radius:8px;border:1px dashed #d3d1c7}
  .pm-prodform input{border:1px solid #cfcdd4;border-radius:6px;padding:6px 9px;font-size:12.5px}
  .cat-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px;background:#fafaf7;border-radius:10px;border:1px dashed #d3d1c7}
  .cat-form input{border:1px solid #cfcdd4;border-radius:6px;padding:7px 10px;font-size:13px}
  .cat-mini{padding:5px 12px;font-size:12.5px}
  /* ===== 车型行点击弹窗（实际VIN码 + 产品列表） ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(30,28,52,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
  .modal-box{background:#fff;border-radius:14px;max-width:1120px;width:100%;padding:22px 24px 26px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .modal-close{border:none;background:#f1efe8;border-radius:50%;width:30px;height:30px;font-size:16px;line-height:1;cursor:pointer;color:#5f5e5a;flex:none}
  .modal-close:hover{background:#e3e0d4;color:#26215c}
  .vins-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .vchip{display:inline-flex;align-items:center;gap:6px;background:#eeedfe;color:#3c3489;border-radius:8px;padding:4px 6px 4px 10px;font-family:Consolas,Menlo,monospace;font-size:13px;letter-spacing:1px}
  .vchip button{border:none;background:rgba(60,52,137,.15);color:#3c3489;border-radius:50%;width:18px;height:18px;line-height:1;cursor:pointer;font-size:12px;padding:0}
  .vchip button:hover{background:#c0392b;color:#fff}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#eeedfe}
  /* ===== 车辆查询页：左字段筛选（竖置）+ 右 VIN 码查询，互斥显示 ===== */
  .vin-search-layout{display:flex;gap:16px;align-items:stretch}
  .fld-panel{width:280px;flex:none;display:flex;flex-direction:column}
  .fld-vert{display:flex;flex-direction:column;gap:1px;margin-top:8px}
  .fld-vert .fld{display:flex;align-items:center;gap:8px;min-height:28px}
  .fld-vert .fld label{width:108px;flex:none;font-size:11px;color:#8a897f;letter-spacing:.5px;font-weight:500;line-height:1.4}
  .fld-vert .fld label small{color:#a3a19a;font-weight:400}
  .fld-vert .fld select,.fld-vert .fld input{flex:1;border:1px solid #c9c8c0;border-radius:6px;padding:4px 10px;font-size:13.5px;font-family:Consolas,Menlo,monospace;background:#fff;outline:none;min-width:0;box-sizing:border-box;letter-spacing:0;height:28px}
  .fld-vert .fld select:focus,.fld-vert .fld input:focus{border-color:#534ab7}
  .fld-btns{display:flex;gap:6px;margin-top:29px;align-items:center}
  .fld-btns .btn{padding:0 10px}
  .result-count{font-size:13px;color:#6c757d;margin-left:4px;white-space:nowrap;flex-shrink:0}
  /* 自定义筛选下拉面板 */
  .filter-input-wrap{position:relative;flex:1;min-width:0}
  .filter-input-wrap input{width:100%;padding-right:24px!important}
  .filter-clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:#999;padding:0;width:16px;height:16px;line-height:1;display:none;z-index:10}
  .filter-clear-btn:hover{color:#333}
  .filter-input-wrap.has-value .filter-clear-btn{display:block}
  .filter-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #c9c8c0;border-top:none;border-radius:0 0 6px 6px;max-height:180px;overflow-y:auto;z-index:1000;display:none;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
  .filter-dropdown.show{display:block}
  .filter-dropdown-item{padding:6px 10px;font-size:13px;cursor:pointer;font-family:Consolas,Menlo,monospace}
  .filter-dropdown-item:hover{background:#f0f0f5}
  .filter-dropdown-item.active{background:#e8e7f5}
  .fld-vert .fld{position:relative}
  /* ===== 左侧产品筛选树（品类 → 产品名称，值来自 /api/categories） ===== */
.ptree-cat.lv1 { font-weight: 600; }
.ptree-cat.lv2 { font-weight: 500; font-size: 0.95em; }
.ptree-cat.lv3 { font-weight: 400; font-size: 0.9em; color: #6b6a5e; }
.cat-lv { font-size: 10px; color: #a09f93; margin-left: 4px; }
.cat-editform { display: inline-flex; gap: 4px; align-items: center; }
.cat-editform input { padding: 2px 6px; font-size: 12px; border: 1px solid #c5c4b8; border-radius: 3px; }
  .ptree-head{font-size:12px;color:#3c3489;font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
  .ptree-head small{font-size:10.5px;color:#a9a79d;font-weight:400}
  .ptree-search{display:flex;gap:6px;margin-bottom:8px}
  .ptree-search input{flex:1;border:1px solid #c9c8c0;border-radius:6px;padding:5px 10px;font-size:12.5px;font-family:inherit;background:#fff;outline:none;box-sizing:border-box;height:30px}
  .ptree-search input:focus{border-color:#534ab7}
  .ptree-search .btn{height:30px;line-height:30px;padding:0 14px;font-size:12px;border-radius:6px;background:#534ab7;color:#fff;border:none;cursor:pointer;white-space:nowrap}
  .ptree-search .btn:hover{background:#413a9a}
  .ptree{max-height:320px;overflow-y:auto;border:1px solid #e8e5d8;border-radius:6px;background:#fff;padding:5px;scrollbar-width:thin}
  .ptree-cat{font-size:12.5px;font-weight:500;color:#26215c;cursor:pointer;padding:5px 6px;border-radius:4px;display:flex;align-items:center;gap:6px;user-select:none}
  .ptree-cat:hover{background:#f6f5ef}
  .ptree-cat.sel{background:#eeedfe;color:#3c3489}

<!-- ===== 登录门（未登录时全屏） ===== -->
<div class="login-gate" id="loginGate">

</div>

  <main class="main">
  <div class="wrap">
  <div class="card">

    <div id="paneS">
      <!-- TOP: VIN 码查询 -->

            <button type="button" class="combo-clear" id="vinClear" title="清空" onclick="clearVin()">×</button>

          <div class="fld"><label>TRANS <small>变速箱</small></label>

        </div>

// ---- 产品管理：树形结构（品类 → 产品；名称在库内手动维护） ----
let CATS = null;       // [{code,cn,en,count,products:[{cn,en,n}]}]
let CAT_UN = 0;        // 未填写品类的产品记录数
let PM_OPEN = {};      // 各品类展开状态（按 code）

async function loadCats(){
  const list = document.getElementById('catList');
  if(list && !CATS) list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch('/api/categories');
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '加载失败');
    CATS = d.categories || [];
    CAT_UN = d.unclassified || 0;
  }catch(e){
    if(list) list.innerHTML = `<div class="msg m-err">无法加载品类数据：${esc(e.message)}</div>`;
    return;
  }
  renderCats();
}

function catMsg(t, isErr){
  const el = document.getElementById('catMsg');
  if(el) el.innerHTML = t ? `<div class="msg ${isErr?'m-err':'m-info'}">${esc(t)}</div>` : '';
}

function _buildCatTree(cats){
  // 从扁平列表构建层级树
  const byParent = {};
  cats.forEach(c => {
    const pk = (c.parent_code || '').toUpperCase();
    if(!byParent[pk]) byParent[pk] = [];
    byParent[pk].push(c);
  });
  // 排序：每个层级内按 code 排序
  Object.values(byParent).forEach(arr => arr.sort((a,b) => a.code.localeCompare(b.code)));
  return byParent;
}

function _renderCatNode(cat, byParent, depth){
  const code = cat.code;
  const open = !!PM_OPEN[code];
  const label = cat.cn ? esc(cat.cn) : (cat.en ? esc(cat.en) : '（未命名）');
  const children = byParent[code] || [];
  const hasKids = children.length > 0;
  const products = cat.products || [];
  const hasProds = products.length > 0;
  const lvClass = 'lv' + (cat.level || 1);
  const indent = (depth || 0) * 18;
  const isLeaf = (cat.level || 1) >= 3;

  // 产品行（三级叶子品类不显示产品列表）
  const prodHtml = isLeaf ? '' : products.map(p => {
    return `<div class="ptree-item" style="padding-left:${indent+22}px" id="pci_${esc(code)}_${esc(p.cn.replace(/"/g,''))}"><span class="pn">${esc(p.cn)}${p.en ? ` <small>${esc(p.en)}</small>` : ''}</span>`
      + `<button class="ghost btn cat-mini pm-editbtn" onclick="event.stopPropagation();editCatalogProduct('${esc(code)}','${esc(p.cn)}','${esc(p.en||'')}')" title="编辑产品名">编辑</button></div>`;
  }).join('');

  // 添加产品表单（三级叶子品类不需要）
  const addFormHtml = isLeaf ? '' : `<div class="pm-prodform" id="pmf_${esc(code)}" style="display:none;padding-left:${indent+22}px">
    <input type="text" id="pmf_cn_${esc(code)}" maxlength="20" placeholder="产品中文名">
    <input type="text" id="pmf_en_${esc(code)}" maxlength="40" placeholder="产品英文名">
    <button class="btn cat-mini" onclick="saveCatalogProduct('${esc(code)}')">保存</button>
    <button class="ghost btn cat-mini" onclick="pmAddProd('${esc(code)}',false)">取消</button>
  </div>`;

  // 操作按钮（三级叶子品类不显示操作按钮）
  const actions = isLeaf ? '' : `<span class="cat-actions">
    <button class="ghost btn cat-mini pm-addprod" onclick="pmAddProd('${esc(code)}');event.stopPropagation()" title="添加产品">＋产品</button>
    <button class="ghost btn cat-mini" onclick="catEditInline('${esc(code)}');event.stopPropagation()" title="编辑品类">编辑</button>
    <button class="ghost btn cat-mini pm-delbtn" onclick="catDelete('${esc(code)}');event.stopPropagation()" title="删除品类" style="color:#c0392b;border-color:#c0392b">删除</button>
  </span>`;

  let html = `<div class="ptree-cat ${lvClass}${open?' open':''}" style="padding-left:${indent}px" onclick="pmToggle('${esc(code)}')">
    <span class="arr">${hasKids||hasProds?'▶':''}</span>
    <span class="cat-code">${esc(code)}</span>
    <span class="cat-name">${label}</span>
    ${hasKids?`<small class="cat-lv">[L${cat.level}]</small>`:''}
    ${actions}
  </div>
  <div class="ptree-kids${open?' open':''}" id="pmk_${esc(code)}">`;

  // 子品类
  children.forEach(ch => {
    html += _renderCatNode(ch, byParent, depth + 1);
  });

  // 产品
  if(hasProds) html += prodHtml;
  else if(!hasKids) html += `<div class="ptree-none" style="padding-left:${indent+22}px">暂无产品</div>`;

  html += '</div>';
  html += addFormHtml;
  return html;
}

function renderCats(){
  const list = document.getElementById('catList');
  if(!list) return;
  if(!CATS || !CATS.length){
    list.innerHTML = '<div class="empty">暂无品类，点击右上「＋ 新增品类」添加</div>';
    return;
  }
  const byParent = _buildCatTree(CATS);
  const roots = byParent[''] || [];
  let html = '<div class="pm-tree" style="max-height:none">';
  roots.forEach(c => {
    html += _renderCatNode(c, byParent, 0);
  });
  html += '</div>';
  if(CAT_UN) html += `<div class="hint" style="margin-top:10px">另有 ${CAT_UN} 条产品记录未填写品类</div>`;
  list.innerHTML = html;
}

function toggleCatForm(show){
  const f = document.getElementById('catForm');
  if(!f) return;
  const on = (show === undefined) ? f.style.display === 'none' : !!show;
  f.style.display = on ? '' : 'none';
  catMsg('');

async function saveCatNew(){
  const level = parseInt(document.getElementById('catLevel')?.value || '1');
  const parent = (document.getElementById('catParent')?.value || '').trim().toUpperCase();
  const code = (document.getElementById('catCode').value || '').trim().toUpperCase();
  const cn = (document.getElementById('catCn')?.value || '').trim();
  const en = (document.getElementById('catEn')?.value || '').trim().toUpperCase();
  if(!code){ catMsg('请填写品类代码', true); return; }
  if(!/^[A-Z0-9-]{1,10}$/.test(code)){ catMsg('品类代码仅限 1-10 位字母 / 数字 / 连字符', true); return; }
  if(level > 1 && !parent){ catMsg('请选择上级品类', true); return; }
  try{
    const r = await fetch('/api/categories', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code, cn, en, level, parent_code: parent})
    });
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '保存失败');
    toggleCatForm(false);
    await loadCats();
  }catch(e){ catMsg(e.message, true); }
}

function onCatLevelChange(){
  const lv = parseInt(document.getElementById('catLevel')?.value || '1');
  const ps = document.getElementById('catParent');
  if(!ps) return;
  if(lv <= 1){
    ps.style.display = 'none';
    ps.innerHTML = '';
  }else{
    // 填充上级品类下拉：二级的上级是一级，三级的上级是二级
    const parentLevel = lv - 1;
    const options = (CATS||[]).filter(c => c.level === parentLevel);
    ps.innerHTML = '<option value="">请选择上级品类</option>' +
      options.map(c => `<option value="${esc(c.code)}">${esc(c.code)} ${esc(c.cn||'')}</option>`).join('');
    ps.style.display = '';
  }
}

let GUIDE_LOADED = false;
let guideRawContent = '';
async function loadGuide(){
  if(GUIDE_LOADED) return;
  const body = document.getElementById('guideBody');
  if(!body) return;
  try{
    const r = await fetch('/api/user-guide');
    const d = await r.json();
    if(!d.ok){ body.innerHTML = '<div class="guide-loading">加载失败：'+esc(d.error||'未知错误')+'</div>'; return; }
    guideRawContent = d.content || '';
    if(typeof marked !== 'undefined' && marked.parse){
      body.innerHTML = marked.parse(guideRawContent);
    } else {
      body.innerHTML = '<pre style="white-space:pre-wrap;font-size:13px">' + esc(guideRawContent) + '</pre>';
    }
    GUIDE_LOADED = true;
    // 只有管理员才能编辑使用说明
    const btnEdit = document.getElementById('btnEditGuide');
    if(btnEdit){ btnEdit.style.display = (CURRENT_USER && CURRENT_USER.role === 'admin') ? 'inline-block' : 'none'; }
  }catch(e){
    body.innerHTML = '<div class="guide-loading">网络错误：'+esc(e.message)+'</div>';
  }
}
function editGuide(){
  if(!guideRawContent && GUIDE_LOADED) return;
  document.getElementById('guideBody').style.display = 'none';
  document.getElementById('guideEditorWrap').style.display = 'flex';
  const editor = document.getElementById('guideEditor');
  editor.value = guideRawContent;
  updateGuidePreview();
  document.getElementById('btnEditGuide').style.display = 'none';
  document.getElementById('btnSaveGuide').style.display = 'inline-block';
  document.getElementById('btnCancelGuide').style.display = 'inline-block';
}
function cancelEditGuide(){
  document.getElementById('guideEditorWrap').style.display = 'none';
  document.getElementById('guideBody').style.display = 'block';
  document.getElementById('btnEditGuide').style.display = 'inline-block';
  document.getElementById('btnSaveGuide').style.display = 'none';
  document.getElementById('btnCancelGuide').style.display = 'none';
}
function updateGuidePreview(){
  const editor = document.getElementById('guideEditor');
  const preview = document.getElementById('guidePreview');
  if(!editor || !preview) return;
  const md = editor.value || '';
  if(typeof marked !== 'undefined' && marked.parse){
    preview.innerHTML = marked.parse(md);
  } else {
    preview.innerHTML = '<pre style="white-space:pre-wrap">' + esc(md) + '</pre>';
  }
}
function mdInsert(syntax, mode){
  const editor = document.getElementById('guideEditor');
  if(!editor) return;
  editor.focus();
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const text = editor.value;
  const selected = text.substring(start, end);
  if(mode === 'wrap'){
    const before = text.substring(0, start);
    const after = text.substring(end);
    editor.value = before + syntax + selected + syntax + after;
    editor.selectionStart = start + syntax.length;
    editor.selectionEnd = start + syntax.length + selected.length;
  } else {
    // line mode: insert at beginning of current line
    const before = text.substring(0, start);
    const after = text.substring(end);
    const insert = '\n' + syntax + (selected || '');
    editor.value = before + insert + after;
    editor.selectionStart = editor.selectionEnd = start + insert.length;
  }
  updateGuidePreview();
}
async function saveGuide(){
  const editor = document.getElementById('guideEditor');
  const newContent = editor.value;
  try{
    const r = await fetch('/api/user-guide', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: newContent})
    });
    const d = await r.json();
    if(!d.ok){ alert('保存失败：'+(d.error||'未知错误')); return; }
    guideRawContent = newContent;
    GUIDE_LOADED = false;
    cancelEditGuide();
    await loadGuide();
    alert('保存成功');
  }catch(e){
    alert('网络错误：'+e.message);
  }
}

  const isAdmin = CURRENT_USER && CURRENT_USER.role === 'admin';
  list.innerHTML = FB_CACHE.map(fb => {
    let replyHtml = '';
    if(fb.reply){
      replyHtml = `<div class="fb-reply"><div class="fb-reply-hd">${esc(fb.replied_by||'管理员')} 回复 · ${esc(fb.replied_at||'')}</div><div class="fb-reply-body">${esc(fb.reply)}</div></div>`;
    }
    let actionsHtml = '';
    if(isAdmin){
      actionsHtml = `<div class="fb-actions">
        ${!fb.reply ? `<button onclick="fbShowReply(${fb.id})">回复</button>` : ''}
        <button class="fb-del" onclick="fbDelete(${fb.id})">删除</button>
      </div>`;
    } else {

        actionsHtml = `<div class="fb-actions"><button class="fb-del" onclick="fbDelete(${fb.id})">删除</button></div>`;
      }
    }
    let replyFormHtml = `<div id="fbReply${fb.id}" class="fb-reply-form" style="display:none">
      <textarea id="fbReplyInput${fb.id}" placeholder="输入回复…"></textarea>
      <button onclick="fbSubmitReply(${fb.id})">发送</button>

      <div class="fb-content">${esc(fb.content)}</div>

  }).join('');

function normVin(s){
  return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}

function validateVin(vin){
  // 澳洲/日本等非北美市场车辆第 9 位非校验位，不做校验位比对
  if(vin.length !== 17) return {ok:false, msg:'长度 '+vin.length+' 位，标准 VIN 为 17 位'};
  if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return {ok:false, msg:'含有非法字符（VIN 不含 I、O、Q）'};
  return {ok:true, msg:'校验通过'};
}

function yearOf(vin){
  const y = YEAR_CODE[vin[9]];
  if(!y) return null;
  return {year:y, alt:y-30};
}

function inYearRange(rec, modelYear){
  if(!modelYear || !rec.ys) return true;
  const lo = rec.ys - 1;
  const hi = rec.ye === null || rec.ye === undefined ? 9999 : rec.ye + 1;
  return modelYear >= lo && modelYear <= hi;
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function fetchVehiclePage(append){
  if(VEH_LOADING) return;
  VEH_LOADING = true;
  const offset = append ? DATA.length : 0;
  const params = new URLSearchParams({limit: String(VEH_PAGESIZE), offset: String(offset)});
  const sq = (document.getElementById('libSearch')?.value || '').trim();
  const sb = (document.getElementById('libBrand')?.value || '');
  const sr = (document.getElementById('libRegion')?.value || '');
  if(sq) params.set('q', sq);
  if(sb) params.set('brand', sb);
  if(sr) params.set('region', sr);
  try{
    const r = await fetch('/api/vehicles?' + params.toString());
    const d = await r.json();
    if(!d.ok){ alert('加载车型失败：' + (d.error || '未知错误')); return; }
    VEH_TOTAL = d.total || 0;
    const rows = d.vehicles || [];
    if(append){
      // 用 id 去重后再追加（防止搜索切换瞬间出现重复）
      const existing = new Set(DATA.map(x => x.id));
      rows.forEach(r2 => { if(!existing.has(r2.id)) DATA.push(r2); });
    } else {
      DATA = rows;
    }
  }catch(e){
    alert('加载车型失败：' + e.message);
    if(!append){ DATA = []; VEH_TOTAL = 0; }
  } finally {
    VEH_LOADING = false;
  }
}

function renderLibrary(){
  const el = document.getElementById('libTable');
  const hint = document.getElementById('libHint');
  const more = document.getElementById('libMore');
  if(!el) return;
  const q = (document.getElementById('libSearch')?.value || '').toLowerCase().trim();
  const brandF = document.getElementById('libBrand')?.value || '';
  const regionF = document.getElementById('libRegion')?.value || '';
  let recs = DATA.slice();
  if(brandF) recs = recs.filter(r => r.brand === brandF);
  if(regionF) recs = recs.filter(r => (r.region||'').split(',').map(s=>s.trim()).includes(regionF));
  if(q) recs = recs.filter(r =>
    (r.brand+' '+r.model+' '+r.sub+' '+r.prefix+' '+r.engine+' '+r.fuel+' '+r.body+' '+r.chassis+' '+r.series+' '+(r.vid||'')+' '+(r.vin17||'')+' '+(r.region||'')).toLowerCase().includes(q)
  );
  // 顶部简短提示：仅在筛选/总数 > 已加载 时提示
  if(hint){
    if(q || brandF || regionF){
      hint.textContent = `筛选结果 ${recs.length} 条（已加载 ${DATA.length} / 共 ${VEH_TOTAL || '?'} 条）`;
    } else {
      hint.textContent = '';
    }
  }
  if(!recs.length){
    el.innerHTML = '<div class="empty">没有匹配的记录</div>';
    if(more) more.innerHTML = '';
    return;
  }
  let html = `<table><thead><tr>
    <th>#</th><th>品牌</th><th>车型</th><th>配置</th><th>年款</th><th>VIN前缀</th><th>排量</th><th>功率</th><th>发动机</th><th>车身</th><th>燃料</th><th>驱动</th><th>变速箱</th><th>vid</th>
  </tr></thead><tbody>`;
  recs.forEach((r,i) => {
    html += `<tr>
      <td class="mono" style="color:#8a897f">${i+1}</td>
      <td>${esc(r.brand)}</td>
      <td>${esc(r.model)}</td>
      <td>${esc(r.sub)}</td>
      <td>${esc(r.year)}</td>
      <td class="mono" style="color:#3c3489;font-weight:500">${esc(r.prefix)}</td>
      <td>${esc(r.cap)}</td>
      <td>${esc(r.kw)}</td>
      <td>${esc(r.engine)}</td>
      <td>${esc(r.body)}</td>
      <td>${esc(r.fuel)}</td>
      <td>${esc(r.drive)}</td>
      <td>${esc(r.transmission)}</td>
      <td class="mono" style="color:#8a897f">${esc(r.vid)}</td>
    </tr>`;
  });
  el.innerHTML = html + '</tbody></table>';
  // "加载更多"按钮：已加载 < 服务端总数时显示；搜索/品牌模式下继续按当前 q/brand 翻页
  if(more){
    const loaded = DATA.length;
    const total = VEH_TOTAL || 0;
    const hasMore = total > loaded;
    if(hasMore){
      const remain = total - loaded;
      if(q) more.innerHTML = `<button class="btn ghost" onclick="loadMoreVehts()">加载更多匹配结果 (剩余 ${remain} / 共 ${total})</button>`;
      else more.innerHTML = `<button class="btn ghost" onclick="loadMoreVehts()">加载更多 (剩余 ${remain} 条 / 共 ${total})</button>`;
    } else {
      more.innerHTML = '';
    }
  }
}

// 解析上传的 Excel → 按列名映射字段 → POST 数组到 /api/vehicles
async function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  input.value = ''; // 允许同名再次上传
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    if(!json.length){ alert('文件为空或无有效数据'); return; }
    // 校验表头（首行）—— 至少包含 车辆ID/品牌/车型
    const headers = Object.keys(json[0]);
    const missing = ['车辆ID','品牌','车型'].filter(h => !headers.includes(h));
    if(missing.length){
      alert('模板列名不正确，缺少必填列：' + missing.join('、') + '\n\n请先点击「模板下载」获取标准模板。');
      return;
    }
    // 映射字段 + 必填校验
    const records = [];
    const skipped = [];
    for(let i=0; i<json.length; i++){
      const row = json[i];
      const rec = {};
      for(const [zh, en] of VEHICLE_XLSX_COLS){
        if(row[zh] !== undefined && row[zh] !== '' && row[zh] != null){
          rec[en] = String(row[zh]).trim();
        }
      }
      // 必填：vid / brand / model
      if(!rec.vid || !rec.brand || !rec.model){
        skipped.push({idx: i+2, vid: rec.vid||'', err: '车辆ID/品牌/车型 至少有一项为空'});
        continue;
      }
      // 数字字段（ys/ye）转 int
      if(rec.ys !== undefined && rec.ys !== ''){
        const n = parseInt(rec.ys, 10); rec.ys = isNaN(n) ? null : n;
      }
      if(rec.ye !== undefined && rec.ye !== ''){
        const n = parseInt(rec.ye, 10); rec.ye = isNaN(n) ? null : n;
      }
      records.push(rec);
    }
    if(!records.length){
      alert('无可用数据：' + (skipped.length ? `前 ${skipped.length} 行因必填为空被跳过` : '请检查文件内容'));
      return;
    }
    showExportLoading(`正在导入 ${records.length} 条车型…`);
    const hint = document.getElementById('libHint');
    if(hint) hint.innerHTML = `<div class="msg m-info">正在导入 ${records.length} 条车型…</div>`;
    const resp = await fetch('/api/vehicles', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(records)
    });
    const d = await resp.json();
    hideExportLoading();
    let msg = `导入完成：成功 <b>${d.count || 0}</b> 条`;
    if(d.skipped) msg += `，跳过 ${d.skipped} 条`;
    if(hint) hint.innerHTML = `<div class="msg m-${(d.errors&&d.errors.length)?'warn':'ok'}">${msg}</div>`;
    // 刷新车型库：重新拉首屏 + 刷新品牌下拉 + 重渲染
    DATA = []; VEH_TOTAL = 0;
    await fetchVehiclePage(false);
    if(d.errors && d.errors.length){
      const sample = d.errors.slice(0, 5).map(e => `第${e.idx}行(${e.vid||'?'}): ${e.error}`).join('\n');
      alert(`成功 ${d.count||0} 条，跳过 ${d.skipped||0} 条。\n\n前几条错误：\n${sample}` + (d.errors.length>5 ? `\n...共 ${d.errors.length} 条错误` : ''));
    } else {
      alert(`导入完成：成功 ${d.count || 0} 条${d.skipped?`（跳过 ${d.skipped} 条）`:''}`);
    }
  }catch(e){
    alert('解析/导入失败：' + e.message);
  }
}

function match(vin){
  const results = {vin, level:0, yearFiltered:false, candidates:[], wmiBrand:null,
    wmiName: wmiOf(vin), country: COUNTRY_MAP[vin[0]] || null};
  // 权威判定层：依据真实 VIN 样本核实的第 4-8 位 VDS（优先级高于车型库前缀）
  const vdsKey = vin.length >= 8 ? vin.slice(3,8) : '';
  results.vdsKey = vdsKey;
  results.vds = vdsKey ? (VDS_MAP[vdsKey] || null) : null;
  const DB = ALL();
  // 最高优先级：完整 17 位 VIN 与库内登记的"实际VIN码"（一条车型可登记多条，逗号分隔）完全一致 → 精确命中该车型
  if(vin.length === 17){
    const exact = DB.filter(r => vehVins(r).includes(vin));
    if(exact.length){
      results.exact = exact[0];
      results.level = 17;
      results.candidates = exact;
      return results;
    }
  }
  for(let L=8; L>=3; L--){
    const hits = DB.filter(r => r.prefix.length === L && vin.startsWith(r.prefix));
    if(hits.length){
      results.level = L;
      results.candidates = hits;
      break;
    }
  }
  if(!results.candidates.length){
    const wmi = vin.slice(0,3);
    const brandHit = DB.filter(r => r.prefix.startsWith(wmi));
    results.wmiBrand = brandHit.length ? brandHit[0].brand : null;
    return results;
  }
  const my = yearOf(vin);
  results.modelYear = my ? my.year : null;
  if(my && results.candidates.length > 1){
    const filtered = results.candidates.filter(r => inYearRange(r, my.year));
    if(filtered.length && filtered.length < results.candidates.length){
      results.candidates = filtered;
      results.yearFiltered = true;
    }
  }
  // ===== VIN 相似度匹配：当仍有多个候选时，逐位比对库内已登记的实际 VIN 码 =====
  // 仅比对前 11 位（WMI + VDS + 校验位 + 年款 + 工厂位），后 6 位（12-17）是流水号不参与比对
  if(vin.length === 17 && results.candidates.length > 1){
    let bestScore = -1, bestRegVin = '', bestVid = null, secondScore = -1;
    results.candidates.forEach(r => {
      let myBest = -1;
      vehVins(r).forEach(rv => {
        if(rv.length !== 17) return;
        let score = 0;
        for(let i=0; i<11; i++) if(vin[i] === rv[i]) score++;
        if(score > myBest) myBest = score;
      });
      if(myBest > bestScore){ secondScore = bestScore; bestScore = myBest; bestRegVin = vehVins(r)[0]||''; bestVid = String(r.vid); }
      else if(myBest > secondScore){ secondScore = myBest; }
    });
    if(bestVid && bestScore >= 10){
      results.vinSimilarity = {regVin: bestRegVin, score: bestScore, vid: bestVid};
      // 满分(11/11)或明显领先(差距≥2) → 唯一判定，只保留相似度最高的候选
      if(bestScore === 11 || bestScore - secondScore >= 2){
        results.candidates = results.candidates.filter(r => String(r.vid) === bestVid);
      } else {
        // 差距不够大 → 相似度最高的排前面，其余保留供参考
        const main = results.candidates.filter(r => String(r.vid) === bestVid);
        const rest = results.candidates.filter(r => String(r.vid) !== bestVid);
        results.candidates = main.concat(rest);
      }
    }
  }
  return results;
}

// 判断车型库候选是否与真实 VDS 规则一致（用于冲突提示）
function vdsAgree(vds, cands){
  if(!cands || !cands.length) return true;
  const terms = (typeof vds === 'string') ? [vds] : vds;
  const candText = cands.map(c => (c.brand+' '+c.model+' '+(c.sub||'')).toLowerCase());
  return terms.some(t => {
    const keys = t.toLowerCase().split('(')[0].trim().split(/[\s/]+/).filter(k => k.length >= 2);
    return candText.some(ct => keys.some(k => ct.includes(k)));
  });
}

function statusOf(r){
  if(!r.candidates.length) return {cls:'b-err', txt:'无匹配'};
  // 完整 17 位 VIN 与库内登记的实际VIN码一致 → 最高置信
  if(r.exact) return {cls:'b-ok', txt:'✅ 实际VIN码精确命中（已核实）'};
  // VIN 相似度匹配成功（优先于 VDS 碰撞/前缀匹配显示）
  if(r.vinSimilarity && r.candidates.length===1) return {cls:'b-ok', txt:'✅ VIN 相似度匹配（参考 '+r.vinSimilarity.regVin+'，前 '+r.vinSimilarity.score+'/11 位一致）'};
  if(r.vinSimilarity) return {cls:'b-warn', txt:'⚠ VIN 相似度参考（'+r.vinSimilarity.regVin+'，前 '+r.vinSimilarity.score+'/11 位一致），'+r.candidates.length+' 个候选'};
  // VDS 判定是唯一字符串 → "唯一判定"（不管库内几条记录）
  if(typeof r.vds === 'string') return {cls:'b-ok', txt:'✅ VDS 唯一判定'};
  // VDS 判定是数组（碰撞） → "VDS 多车型碰撞"
  if(Array.isArray(r.vds)) return {cls:'b-warn', txt:'⚠ VDS 多车型碰撞（'+r.vds.length+' 个候选）'};
  // 无 VDS 判定，按车型库前缀匹配
  if(r.candidates.length === 1){
    if(r.level >= 6) return {cls:'b-ok', txt: r.yearFiltered ? '精确匹配（年款筛选）' : '精确匹配'};
    if(r.level >= 4) return {cls:'b-warn', txt:'前 '+r.level+' 位匹配'};
    return {cls:'b-warn', txt:'仅 WMI 品牌级匹配'};
  }
  return {cls:'b-warn', txt:'无 VDS 判定，'+r.candidates.length+' 个候选待人工确认'};
}

// 从候选里挑一个跟 VDS 判定文本最贴合的（首词命中）
function pickBestCandidate(vdsText, candidates){
  if(!candidates || !candidates.length) return null;
  const keywords = String(vdsText).toLowerCase().split(/[\s/()（）、]+/).filter(w => w.length >= 2);
  if(!keywords.length) return candidates[0];
  // 优先取含最多关键词的候选
  let best = null, bestScore = -1;
  candidates.forEach(c => {
    const txt = (c.brand + ' ' + c.model + ' ' + (c.sub||'')).toLowerCase();
    const score = keywords.reduce((s,k) => s + (txt.includes(k) ? 1 : 0), 0);
    if(score > bestScore){ bestScore = score; best = c; }
  });
  return best || candidates[0];
}

function prodMatches(q, text){
  if(!q) return true;
  return String(text || '').toLowerCase().includes(q);

function prodSearch(){

  PROD_SEARCH = (input && input.value || '').trim();

function renderProdTree(){
  const box = document.getElementById('prodTree');
  if(!box) return;
  if(!CATS || !CATS.length){
    box.innerHTML = '<div class="ptree-none">暂无品类，请到「产品管理」添加</div>';
    return;
  }
  const q = PROD_SEARCH.toLowerCase();
  const byParent = _buildCatTree(CATS);
  const roots = byParent[''] || [];
  let hasAny = false;

  function _renderProdNode(cat, depth){
    const ci = CATS.indexOf(cat);
    const code = cat.code;
    const prods = cat.products || [];
    const children = byParent[code] || [];
    const catHit = prodMatches(q, code) || prodMatches(q, cat.cn) || prodMatches(q, cat.en);
    const matched = q ? prods.filter(p => catHit || prodMatches(q, p.cn) || prodMatches(q, p.en)) : prods;

    // 递归子品类是否有匹配
    let childHtml = '';
    let childHasAny = false;
    children.forEach(ch => {
      const chResult = _renderProdNode(ch, depth+1);
      if(chResult.html) { childHtml += chResult.html; childHasAny = true; }
    });

    if(q && !catHit && !matched.length && !childHasAny) return {html:''};
    hasAny = true;
    if(q) PROD_TREE_OP[code] = true;
    const open = !!PROD_TREE_OP[code];
    const selC = PROD_FILTER.code === code && !PROD_FILTER.name;
    const label = cat.cn ? esc(cat.cn) : (cat.en ? esc(cat.en) : '（未命名）');
    const showProds = q && catHit && !matched.length ? prods : matched;
    const kids = showProds.map(p => {
      const pi = prods.indexOf(p);
      const sel = PROD_FILTER.code === code && PROD_FILTER.name === p.cn;
      return `<div class="ptree-item${sel?' sel':''}" style="margin-left:20px" title="${esc(p.cn)}${p.en?' '+esc(p.en):''}" onclick="prodPick(${ci},${pi})">
        <span class="pn">${esc(p.cn)}${p.en ? ` <small>${esc(p.en)}</small>` : ''}</span></div>`;
    }).join('');

    const hasExpand = children.length > 0 || prods.length > 0;
    let html = `<div class="ptree-cat lv${cat.level||1}${selC?' sel':''}${open?' open':''}" onclick="prodCatPick(${ci})">
        <span class="arr" onclick="event.stopPropagation();prodTreeExpand(${ci})">${hasExpand?'▶':''}</span>
        <span>${esc(code)} · ${label}</span>
      </div>
      <div class="ptree-kids${open?' open':''}">${childHtml}${kids || (children.length ? '' : '<div class="ptree-none" style="margin-left:20px">暂无产品</div>')}</div>`;
    return {html};
  }

  let html = `<div class="ptree-cat ptree-all${!PROD_FILTER.code && !PROD_FILTER.name?' sel':''}" onclick="prodPickAll()">
        <span class="arr" style="visibility:hidden">▶</span>
        <span>所有类别</span>
      </div>`;
  roots.forEach(c => {
    const result = _renderProdNode(c, 0);
    html += result.html || '';
  });
  box.innerHTML = q && !hasAny ? '<div class="ptree-none">无匹配产品</div>' : html;
}

function filterProdsForVid(vid){

  // 按英文名排序，方便查找
  all.sort((a, b) => (a.en || '').localeCompare(b.en || '', undefined, {numeric: true, sensitivity: 'base'}));

  return all.filter(p => {

    if(PROD_FILTER.name && String(p.cn || '') !== PROD_FILTER.name) return false;

async function renderActiveProds(vid){
  const target = document.getElementById('cardsProds');

  target.dataset.vid = String(vid);
  if(!PRODUCTS_READY){
    target.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#3c3489;font-size:13px">VID ${esc(vid)} 关联产品</b><span style="color:#8a897f;font-size:11.5px">产品型号加载中…</span></div><div class="empty">正在后台加载产品数据，稍候自动显示…</div>`;
    loadProductsLazy();
    return;
  }
  let prods = filterProdsForVid(vid);
  if(!prods.length){
    target.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#3c3489;font-size:13px">VID ${esc(vid)} 关联产品</b></div><div class="empty">该车型暂无关联产品</div>`;
    return;
  }
  // 拉取该车型下每个产品的备注（存于 product_vehicles.remark，按 product_id 关联）
  const remarkMap = {};
  try{
    const r = await fetch('/api/product-vehicle-remarks?vid=' + encodeURIComponent(vid));
    const d = await r.json();
    if(d && d.ok && Array.isArray(d.remarks)){
      d.remarks.forEach(x => { if(x.product_id != null) remarkMap[x.product_id] = x.remark || ''; });
    }
  }catch(e){}
  prods = prods.map(p => Object.assign({}, p, {remark: remarkMap[p.id] || ''}));
  target.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="color:#3c3489;font-size:13px">VID ${esc(vid)} 关联产品</b></div>${renderProducts(prods)}`;

function renderProducts(items){
  if(!items || !items.length) return '';
  // 按 grp（零件大类字母）分组展示；合并为单一表格以保证所有数据行列宽对齐
  const groups = {};
  items.forEach(p => { const g = p.grp || ''; (groups[g] = groups[g] || []).push(p); });
  // 分组顺序按 grp 代码升序（A/B/C…）；每组内产品按英文名（en）升序，方便查找
  const order = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  order.forEach(g => groups[g].sort((a, b) => (a.en || '').localeCompare(b.en || '', undefined, {numeric: true, sensitivity: 'base'})));
  let body = `<table class="ptab"><thead><tr><th>品名</th><th>OE 号</th><th>品牌</th><th>CDAP</th><th>位置</th><th>备注</th></tr></thead><tbody>`;
  order.forEach(g => {
    if(g) body += `<tr class="pgrp-tr"><td colspan="6">${esc(g)} 类</td></tr>`;
    groups[g].forEach(p => {
      body += `<tr><td>${esc(p.cn)}${p.en ? ` <span class="pen">${esc(p.en)}</span>` : ''}</td>`
            + `<td class="mono">${p.oe ? esc(p.oe) : '—'}</td>`
            + `<td>${p.brand ? esc(p.brand) : '—'}</td>`
            + `<td>${p.cdap ? esc(p.cdap) : '—'}</td>`
            + `<td>${p.loc ? esc(p.loc) : '—'}</td>`
            + `<td style="color:#666;font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.remark||'')}">${p.remark ? esc(p.remark) : '—'}</td></tr>`;
    });
  });
  body += '</tbody></table>';
  return `<div class="prod"><div class="prod-h">关联产品</div>${body}</div>`;
}

let ePROD_FILTER  = { code: null, name: null };
let ePROD_TREE_OP = {};
let ePROD_SEARCH  = '';

async function loadEditProdTree(force){
  const box = document.getElementById('eprodTree');

function renderEditProdTree(){
  const box = document.getElementById('eprodTree');
  if(!box) return;
  if(!CATS || !CATS.length){
    box.innerHTML = '<div class="ptree-none">暂无品类，请到「产品管理」添加</div>';
    return;
  }
  // 获取当前选中车型的产品计数：按 (grp, cn) 统计已关联数量
  const eProdsBox = document.getElementById('ecardsProds');
  const curVid = (eProdsBox && eProdsBox.dataset.vid) || '';
  const vidCounts = {};
  if(curVid && PRODUCTS_READY && PRODUCTS){
    (PRODUCTS[curVid] || []).forEach(p => {
      const k = (p.grp||'') + '\x00' + (p.cn||'');
      vidCounts[k] = (vidCounts[k] || 0) + 1;
    });
  }
  const q = ePROD_SEARCH.toLowerCase();
  let hasAny = false;
  const byParent = _buildCatTree(CATS);
  const roots = byParent[''] || [];

  function _renderEditProdNode(cat, depth){
    const ci = CATS.indexOf(cat);
    const code = cat.code;
    if(!inMyCats(code)) return {html:''};
    const prods = cat.products || [];
    const children = byParent[code] || [];
    const catHit = prodMatches(q, code) || prodMatches(q, cat.cn) || prodMatches(q, cat.en);
    const matched = q ? prods.filter(p => catHit || prodMatches(q, p.cn) || prodMatches(q, p.en)) : prods;

    let childHtml = '';
    let childHasAny = false;
    children.forEach(ch => {
      const r = _renderEditProdNode(ch, depth+1);
      if(r.html){ childHtml += r.html; childHasAny = true; }
    });

    if(q && !catHit && !matched.length && !childHasAny) return {html:''};
    hasAny = true;
    if(q) ePROD_TREE_OP[code] = true;
    const open = !!ePROD_TREE_OP[code];
    const selC = ePROD_FILTER.code === code && !ePROD_FILTER.name;
    const label = cat.cn ? esc(cat.cn) : (cat.en ? esc(cat.en) : '（未命名）');
    const showProds = q && catHit && !matched.length ? prods : matched;
    const kids = showProds.map(p => {
      const pi = prods.indexOf(p);
      const sel = ePROD_FILTER.code === code && ePROD_FILTER.name === p.cn;
      const ck = (code||'') + '\x00' + (p.cn||'');
      const cnt = vidCounts[ck] || 0;
      const cntBadge = curVid ? `<span class="pm-prod-count${cnt?'':' zero'}">${cnt}</span>` : '';
      return `<div class="ptree-item${sel?' sel':''}" style="margin-left:20px" title="${esc(p.cn)}${p.en?' '+esc(p.en):''}" onclick="eprodPick(${ci},${pi})">
        <span class="pn">${esc(p.cn)}${p.en ? ` <small>${esc(p.en)}</small>` : ''}${cntBadge}</span>
        <button class="ghost btn cat-mini" style="margin-left:6px;flex-shrink:0;font-size:11px;padding:1px 7px" onclick="event.stopPropagation();addProdFromCat(${ci},${pi})" title="添加到当前车型">＋</button></div>`;
    }).join('');

    const hasExpand = children.length > 0 || prods.length > 0;
    let html = `<div class="ptree-cat lv${cat.level||1}${selC?' sel':''}${open?' open':''}" onclick="eprodCatPick(${ci})">
        <span class="arr" onclick="event.stopPropagation();eprodTreeExpand(${ci})">${hasExpand?'▶':''}</span>
        <span>${esc(code)} · ${label}</span>
      </div>
      <div class="ptree-kids${open?' open':''}">${childHtml}${kids || (children.length ? '' : '<div class="ptree-none" style="margin-left:20px">暂无产品</div>')}</div>`;
    return {html};
  }

  let html = `<div class="ptree-cat ptree-all${!ePROD_FILTER.code && !ePROD_FILTER.name?' sel':''}" onclick="eprodPickAll()">
        <span class="arr" style="visibility:hidden">▶</span>
        <span>所有类别</span>
      </div>`;
  roots.forEach(c => {
    const result = _renderEditProdNode(c, 0);
    html += result.html || '';
  });
  if(!hasAny){
    const mc = myCats();
    box.innerHTML = `<div class="ptree-none">${(mc !== null && mc.length === 0) ? '你尚未被分配任何管理品类' : '无匹配产品'}</div>`;
    return;
  }
  box.innerHTML = html;
}

// 导出 = 当前查询结果显示的车型（车型筛选 / VIN / VID 查询，只看屏幕结果）
async function exportEditVehicles(){
  // 采集屏幕上结果卡片的 VID（eoutS=VIN/VID 查询，eoutF=车型属性筛选；二者互斥，仅其一有内容）
  const vids = new Set();
  document.querySelectorAll('#eoutS .vcard[data-vid], #eoutF .vcard[data-vid]').forEach(c => {
    const v = (c.getAttribute('data-vid') || '').trim();
    if(v) vids.add(String(v));
  });
  const vidArr = [...vids];
  if(!vidArr.length){ alert('请先查询（车型筛选 / VIN / VID）得到结果后再点导出'); return; }
  showExportLoading();
  try{
    const r = await fetch('/api/export-vehicles', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({vids: vidArr})
    });
    if(!r.ok){ alert('导出失败：HTTP '+r.status); return; }
    const blob = await r.blob();
    if(blob.size < 100){ alert('导出失败：无数据或服务器错误'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'AutoIndex_Export_' + new Date().toISOString().slice(0,10) + '.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ alert('导出失败：' + e.message); }
  finally{ hideExportLoading(); }
}

// 保存：校验格式，POST /api/vehicles {id, vin17} 全量覆盖；成功更新本地 + 刷新面板
async function saveEditVin(vid){
  const ta = document.getElementById('editVinInput');
  if(!ta) return;
  const raw = ta.value || '';
  // 前端预校验：每条须 17 位合法 VIN（不含 I/O/Q）
  const tokens = raw.split(/[,;\s、，；\n\r]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  const bad = tokens.filter(v => !/^[A-HJ-NPR-Z0-9]{17}$/.test(v));
  if(bad.length){
    alert('以下 VIN 不合法（须 17 位且不含 I/O/Q）：\n' + bad.join('\n'));
    return;
  }
  if(tokens.length > 50){
    alert('单条车型最多登记 50 个实际 VIN，当前 ' + tokens.length + ' 条');
    return;
  }
  const r = (ALL() || []).find(x => x.vid === String(vid));
  if(!r){ alert('未找到该车型（id 缺失）'); return; }
  try{
    const resp = await fetch('/api/vehicles', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: r.id, vin17: raw})
    });
    const d = await resp.json();
    if(d.ok){
      r.vin17 = tokens.join(',') || '';
      toggleEditVinInput(vid, false);
      renderEditProds(vid);
    } else {
      alert('保存失败：' + (d.error || '未知错误'));
    }
  } catch(e){
    alert('保存失败：' + e.message);
  }
}

// 删除：confirm → DELETE /api/products → 刷新本面板和 VIN 查询页
async function deleteProdRow(vid, idx){
  const all = productsForVid(vid);
  const p = all[idx];
  if(!p) return;
  // 地区组权限校验
  const veh = ALL().find(r => String(r.vid) === String(vid));
  if(veh && !canEditRegion(veh.region)){ alert('你无权编辑该地区的车型产品'); return; }
  const name = p.cn + (p.en ? ' ('+p.en+')' : '');
  if(!confirm('确定删除产品「'+name+'」？此操作不可撤销。')) return;
  try{
    const r = await fetch('/api/products', {method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({vid, id: p.id||0})});
    const d = await r.json();
    if(d.ok){
      // 从内存数组移除
      const arr = PRODUCTS[String(vid)];
      if(arr) arr.splice(idx, 1);
      renderEditProds(vid);
      renderEditProdTree();   // 删除产品后刷新左侧计数徽章
      // 同步刷新 VIN 查询页
      const outS = document.getElementById('cardsProds');
      if(outS && outS.dataset.vid === String(vid)) renderActiveProds(vid);
    }else{
      alert('删除失败：' + (d.error||'未知错误'));
    }
  }catch(e){
    alert('删除失败：' + e.message);
  }
}
// 保存：调 /api/products POST 写回 SQLite，成功后刷新本面板和 VIN 查询页（如果展开中）
async function saveEditProdRow(vid, idx){
  const row = document.querySelector(`#ecardsProds tr[data-idx="${idx}"]`);
  if(!row) return;
  const all = productsForVid(vid);
  const p = all[idx];
  if(!p) return;
  if(!inMyCats(p.grp)){ alert('无权修改该品类下的产品'); return; }
  // 地区组权限校验
  const veh = ALL().find(r => String(r.vid) === String(vid));
  if(veh && !canEditRegion(veh.region)){ alert('你无权编辑该地区的车型产品'); return; }
  const oe        = (row.querySelector('input[data-f="oe"]').value        || '').trim();
  const brand     = (row.querySelector('input[data-f="brand"]').value      || '').trim();
  const cdap      = (row.querySelector('input[data-f="cdap"]').value       || '').trim();
  const supplier  = (row.querySelector('input[data-f="supplier"]').value   || '').trim();
  const moq       = (row.querySelector('input[data-f="moq"]').value        || '').trim();
  const cost      = (row.querySelector('input[data-f="cost"]').value       || '').trim();
  const loc       = locFromCheckboxes(row.querySelector('.td-loc'));
  const interchange = (row.querySelector('input[data-f="interchange"]').value || '').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean).join(',');

  // 保存前重复校验（品类+中文名+英文名+OE号+CDAP号 全部相同才算重复，排除自身）
  const allForDup = productsForVid(vid);
  const dup = allForDup.find((pp, ii) => ii !== idx &&
    (pp.grp||'').toUpperCase()===(p.grp||'').toUpperCase() &&
    (pp.cn||'')===(p.cn||'') &&
    (pp.en||'').toUpperCase()===(p.en||'').toUpperCase() &&
    (pp.oe||'').toUpperCase()===(oe||'').toUpperCase() &&
    (pp.cdap||'').toUpperCase()===(cdap||'').toUpperCase()
  );
  if(dup){
    alert('重复：该车型已存在相同产品（'+p.cn+(p.en?' ('+p.en+')':'')+'，OE:'+(dup.oe||'无')+'，CDAP:'+(dup.cdap||'无')+'），请修改后重试'); return;
  }

  const body = {
    vid, id: p.id||0,
    grp: p.grp||'', cn: p.cn||'', en: p.en||'',
    oe, brand, cdap, supplier,
    notes: p.notes||'', cost, moq, loc, interchange
  };
  try{
    const r = await fetch('/api/products', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(d.ok){
      p.oe = oe; p.brand = brand; p.cdap = cdap; p.supplier = supplier; p.moq = moq; p.cost = cost; p.loc = loc; p.interchange = interchange;
      if(d.id) p.id = d.id;
      // 同步保存备注（如果有改动）
      const remarkInp = row.querySelector('input.ped-remark');
      if(remarkInp){
        const newRemark = (remarkInp.value || '').trim();
        const oldRemark = EDIT_REMARKS[p.id] || '';
        if(newRemark !== oldRemark){
          try{
            const rr = await fetch('/api/product-vehicle-remark', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pid: p.id, vid: vid, remark: newRemark})});
            const rd = await rr.json();
            if(rd.ok){ EDIT_REMARKS[p.id] = newRemark; }
            else{ alert('备注保存失败：' + (rd.error||'未知错误')); }
          }catch(e){ alert('备注保存失败：' + e.message); }
        }
      }
      renderEditProds(vid);
      // 同步刷新 VIN 查询页（如果该车型在 cardsProds 展开中）
      const outS = document.getElementById('cardsProds');
      if(outS && outS.dataset.vid === String(vid)) renderActiveProds(vid);
    }else{
      alert('保存失败：' + (d.error||'未知错误'));
    }
  }catch(e){
    alert('保存失败：' + e.message);
  }
}

/** 弹窗保存：校验重复 → POST 写入 → 刷新列表 */
async function submitAddProdModal(vid, grp, cn, en){
  const ov = document.getElementById('addProdOverlay');
  if(!ov) return;
  // 地区组权限校验
  const veh = ALL().find(r => String(r.vid) === String(vid));
  if(veh && !canEditRegion(veh.region)){ alert('你无权编辑该地区的车型产品'); ov.remove(); return; }
  const oe       = (ov.querySelector('#apOe').value||'').trim();
  const cdap     = (ov.querySelector('#apCdap').value||'').trim();
  const brand    = (ov.querySelector('#apBrand').value||'').trim();
  const supplier = (ov.querySelector('#apSupplier').value||'').trim();
  const moq      = (ov.querySelector('#apMoq').value||'').trim();
  const cost     = (ov.querySelector('#apCost').value||'').trim();
  const loc      = locFromCheckboxes(ov);
  const notes    = (ov.querySelector('#apNotes').value||'').trim();
  const interchange = (ov.querySelector('#apInterchange').value||'').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean).join(',');

  // 保存时重复校验（grp+cn+en+oe+cdap 全同才算重复）
  const all = productsForVid(vid);
  const dup = all.find(p =>
    (p.grp||'').toUpperCase()===(grp||'').toUpperCase() &&
    (p.cn||'')===(cn||'') &&
    (p.en||'').toUpperCase()===(en||'').toUpperCase() &&
    (p.oe||'').toUpperCase()===(oe||'').toUpperCase() &&
    (p.cdap||'').toUpperCase()===(cdap||'').toUpperCase()
  );
  if(dup){
    alert('重复：该车型已存在相同产品（'+cn+(en?' ('+en+')':'')+'，OE:'+(dup.oe||'无')+'，CDAP:'+(dup.cdap||'无')+'），请修改后重试'); return;
  }

  try{
    const r = await fetch('/api/products', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({vid:String(vid), id:0, grp, cn, en, brand, cdap, oe, supplier, cost, moq, notes, loc, interchange})});
    const d = await r.json();
    if(d.ok){
      const np = {id:d.id, vid:String(vid), grp, cn, en, brand, cdap, oe, notes, supplier, cost, moq, loc, interchange};
      if(!PRODUCTS[String(vid)]) PRODUCTS[String(vid)] = [];
      PRODUCTS[String(vid)].push(np);
      ov.remove();
      // 备注统一存为车型级(product_vehicles.remark)，与产品行编辑保存方式一致
      if(notes){
        try{
          await fetch('/api/product-vehicle-remark', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({pid: d.id, vid: String(vid), remark: notes})});
        }catch(e){}
      }
      renderEditProds(vid);
      renderEditProdTree();   // 新增产品后刷新左侧计数徽章
      const outS = document.getElementById('cardsProds');
      if(outS && outS.dataset.vid === String(vid)) renderActiveProds(vid);
    }else{
      alert('添加失败：' + (d.error||'未知错误'));
    }
  }catch(e){
    alert('添加失败：' + e.message);
  }
}

function queryEdit(){
  const outF = document.getElementById('eoutF'); if(outF) outF.innerHTML = '';
  const efldHint = document.getElementById('efldHint'); if(efldHint) efldHint.textContent = '';

  const hints    = document.getElementById('evinHints');
  const cardsBox = document.getElementById('eoutS');
  const prodsBox = document.getElementById('ecardsProds');
  const vpicBox  = document.getElementById('evpicOut');
  const vpicBtn  = document.getElementById('evpicBtnBox');
  if(prodsBox){ prodsBox.classList.remove('open'); prodsBox.innerHTML=''; prodsBox.dataset.vid=''; }
  if(vpicBox){ vpicBox.innerHTML=''; }
  if(vpicBtn){ vpicBtn.innerHTML=''; }
  document.querySelectorAll('#eoutS .vcard-vin.active').forEach(c => c.classList.remove('active'));

  const raw = (document.getElementById('evin').value || '').trim();
  if(raw){
    let vidHits = ALL().filter(r => String(r.vid) === raw);
    const rg = myRegionGroup();
    if(rg) vidHits = vidHits.filter(r => canEditRegion(r.region));
    if(vidHits.length){
      cardsBox.innerHTML = vidHits.map(editCard).join('');
      updateEditResultCount(vidHits.length);
      hints.innerHTML = `<div class="msg m-ok">按 VID 精确匹配到 <b>${vidHits.length}</b> 条车型${vidHits.length>1?'（同名多配置）':''}</div>`;
      if(vpicBtn) vpicBtn.innerHTML = '';
      return;
    }
    if(rg && ALL().filter(r => String(r.vid) === raw).length && !vidHits.length){
      hints.innerHTML = `<div class="msg m-err">该 VID 对应的车型不在你可编辑的地区范围内</div>`;
      cardsBox.innerHTML = '';
      updateEditResultCount(0);
      return;
    }
  }

  const vin = normVin(raw);
  if(!vin){ hints.innerHTML = '<div class="empty">请输入 VIN 码或 VID（如 62036）</div>'; cardsBox.innerHTML=''; updateEditResultCount(0); return; }

  const val = validateVin(vin);
  const r = match(vin);
  window._lastR = r;

  let msgHtml = '';
  if(vin.length === 17){
    msgHtml += vinStrip(vin);
  }
  if(!val.ok){
    msgHtml += `<div class="msg m-err">${val.msg} —— 仍按前缀尝试匹配：</div>`;
  }

  // 地区组权限过滤：VIN 匹配结果也受地区限制
  const _rg = myRegionGroup();
  if(_rg && r.candidates.length){
    const beforeCount = r.candidates.length;
    r.candidates = r.candidates.filter(c => canEditRegion(c.region));
    // 精确命中也要过滤
    if(r.exact && !canEditRegion(r.exact.region)) r.exact = null;
    // 仅当还有剩余候选时显示隐藏数量提示；全部被过滤时由下方红色提示统一说明
    if(r.candidates.length > 0 && r.candidates.length < beforeCount){
      const removed = beforeCount - r.candidates.length;
      msgHtml += `<div class="msg m-info" style="font-size:12px">${removed} 条候选因不在你可编辑的地区范围内已隐藏</div>`;
    }
  }
  const collectRecs = (() => {
    if(!r.candidates.length) return { main: [], leftover: [] };
    const main = []; const leftover = []; const usedVid = new Set();
    if(r.exact){ main.push(r.exact); usedVid.add(r.exact.vid); }
    else if(typeof r.vds === 'string'){
      const c = pickBestCandidate(r.vds, r.candidates);
      if(c){ main.push(c); usedVid.add(c.vid); }
    } else if(Array.isArray(r.vds)){
      r.vds.forEach(entry => {
        const c = pickBestCandidate(entry, r.candidates.filter(x => !usedVid.has(x.vid)));
        if(c){ usedVid.add(c.vid); main.push(c); }
      });
      r.candidates.filter(x => !usedVid.has(x.vid)).forEach(x => leftover.push(x));
    } else {
      r.candidates.forEach(x => { main.push(x); usedVid.add(x.vid); });
    }
    return { main, leftover };
  })();

  if(!collectRecs.main.length && !collectRecs.leftover.length){
    if(_rg && !r.candidates.length && (r.level > 0 || r.exact)){
      msgHtml += `<div class="msg m-err"><b>匹配到的车型不在你可编辑的地区范围内。</b> 请联系管理员调整地区组权限。</div>`;
    } else {
      msgHtml += `<div class="msg m-err"><b>未匹配到车型。</b>`;
      if(r.wmiBrand) msgHtml += ` 该 VIN 的 WMI（${vin.slice(0,3)}）属于库内品牌 <b>${r.wmiBrand}</b>，但此具体车型未收录，建议补充车型库。`;
      else if(r.wmiName) msgHtml += ` 按 WMI 规则识别为 <b>${r.wmiName}</b>（产地 ${r.country||'未知'}），但该厂商不在你的车型库覆盖范围内。`;
      else msgHtml += ` WMI（${vin.slice(0,3)}）不在你的车型库覆盖范围内，公开 WMI 规则中也未收录。`;
      msgHtml += '</div>';
    }
    cardsBox.innerHTML = '';
    updateEditResultCount(0);
  } else {
    const allRecs = collectRecs.main.concat(collectRecs.leftover);
    cardsBox.innerHTML = allRecs.map(editCard).join('');
    updateEditResultCount(allRecs.length);
    if(collectRecs.leftover.length && collectRecs.main.length){
      msgHtml += `<div class="msg m-info" style="font-size:12px">另有 ${collectRecs.leftover.length} 条库内记录未匹配 VDS 判定，已并入卡片尾部，仅作参考</div>`;
    }
  }

  if(vin.length === 17){
    if(vpicBtn) vpicBtn.innerHTML = `<button class="btn" onclick="editVpicCheck('${vin}')">联网官方核对（NHTSA 美国交通部）</button>`;
  } else if(vpicBtn){
    vpicBtn.innerHTML = '';
  }

  hints.innerHTML = msgHtml;
}
function editVpicCheck(vin){
  const box = document.getElementById('evpicOut');
  if(!box) return;
  box.innerHTML = '<div class="hint">查询 NHTSA 官方库中…</div>';
  fetch('/api/vpic?vin=' + vin).then(r => r.json()).then(d => {
    if(!d.ok){ box.innerHTML = `<div class="msg m-err">官方查询失败：${esc(d.error||'')}</div>`; return; }
    if(!d.make){
      box.innerHTML = `<div class="msg m-warn"><b>NHTSA 无此 VIN 数据</b> —— 多为中国/澳洲等未在美注册车型。请以本工具"车型系列码（真实 VIN 样本）"或车型库为参考，并交叉核对实车铭牌。</div>`;
      return;
    }
    let badge = '';
    const r = window._lastR;
    if(r && r.candidates.length){
      const tbl = (r.candidates[0].brand || '').toUpperCase();
      const off = (d.make || '').toUpperCase();
      if(tbl && (off.includes(tbl) || tbl.includes(off))) badge = '<span class="badge b-ok">与车型库一致</span>';
      else badge = `<span class="badge b-err">⚠ 与车型库不符：库内=${esc(r.candidates[0].brand)} / 官方=${esc(d.make)}</span>`;
    }
    box.innerHTML = `<div class="msg m-info" style="margin-top:10px"><b>官方数据库（NHTSA vPIC · 美国交通部）</b> ${badge}</div>
      <div class="vgrid">${vitem('厂商', d.make)}${vitem('车型', d.model)}${vitem('年款', d.modelYear)}${vitem('配置', d.trim)}${vitem('系列', d.series)}${vitem('发动机', d.engineModel)}${vitem('排量(L)', d.displacementL)}${vitem('燃料', d.fuelType)}${vitem('车身', d.bodyClass)}${vitem('驱动', d.driveType)}${vitem('产国', d.plantCountry)}</div>`;
  }).catch(e => { box.innerHTML = `<div class="msg m-err">网络错误：${esc(e.message)}</div>`; });
}

function vinStrip(vin){
  const segs = [
    {cls:'s-wmi', l:'品牌 WMI', t:vin.slice(0,3)},
    {cls:'s-attr', l:'车型配置', t:vin.slice(3,8)},
    {cls:'s-chk', l:'校验位', t:vin.slice(8,9)},
    {cls:'s-year', l:'年款', t:vin.slice(9,10)},
    {cls:'s-plant', l:'工厂', t:vin.slice(10,11)},
    {cls:'s-ser', l:'序列号', t:vin.slice(11,17)}
  ];
  return '<div class="vinstrip">' + segs.map(s=>`<div class="seg ${s.cls}"><small>${s.l}</small><b>${s.t}</b></div>`).join('') + '</div>';
}

// ---- OE 查询：按 OE 号或品名搜索产品，显示对应车型 ----
function queryByOe(){
  const out = document.getElementById('outO');
  const q = (document.getElementById('oeInput').value || '').trim().toLowerCase();
  if(!q){ out.innerHTML = '<div class="empty">请输入 OE 号或 CDAP 号</div>'; return; }

  // vid → 车型记录
  const vidMap = {};
  (DATA || []).forEach(r => { if(r.vid) vidMap[String(r.vid)] = r; });

  // 遍历全部产品，匹配 oe / cn / en / brand / cdap
  // 仅检索「有 OE 号或 CDAP 号码」的产品
  const matches = [];
  Object.keys(PRODUCTS).forEach(vid => {
    (PRODUCTS[vid] || []).forEach(p => {
      if(String(p.oe||'').trim() === '' && String(p.cdap||'').trim() === '') return; // 无 OE 且无 CDAP 的产品跳过
      const oe  = String(p.oe   || '').toLowerCase();
      const cd  = String(p.cdap || '').toLowerCase();
      // 仅按 OE 号或 CDAP 号码匹配
      if(oe.includes(q) || cd.includes(q)){
        matches.push({ product: p, vehicle: vidMap[String(vid)] || null, vid: vid });
      }
    });
  });

  if(!matches.length){
    out.innerHTML = `<div class="msg m-warn">未找到匹配产品（关键词：${esc(q)}）。请确认 OE 号或 CDAP 号输入正确。</div>`;
    return;
  }

  let html = `<div class="msg m-info">找到 <b>${matches.length}</b> 条匹配产品，对应 ${new Set(matches.filter(m=>m.vehicle).map(m=>m.vid)).size} 个车型</div>`;
  matches.forEach((m, idx) => {
    const p = m.product;
    const v = m.vehicle;
    const pid = 'oeprod_' + idx;
    html += `<div class="cand">
      <h4>${esc(p.cn) || '—'} <span style="color:#8a897f;font-weight:400;font-size:12px">· OE ${esc(p.oe) || '无'}</span>
        ${p.brand ? `<span class="pcnt" style="margin-left:6px">${esc(p.brand)}</span>` : ''}</h4>
      <table class="ptab"><thead><tr><th>品名</th><th>OE 号</th><th>品牌</th><th>CDAP</th><th>供应商</th></tr></thead><tbody>
        <tr><td>${esc(p.cn) || '—'}${p.en ? ` <span class="pen">${esc(p.en)}</span>` : ''}</td>
            <td class="mono">${esc(p.oe) || '—'}</td>
            <td>${esc(p.brand) || '—'}</td>
            <td>${esc(p.cdap) || '—'}</td>
            <td>${esc(p.supplier) || '—'}</td></tr>
      </tbody></table>`;
    if(v){
      html += `<div class="vgrid" style="margin-top:10px">
        ${vitem('品牌', v.brand)}${vitem('车型', (v.model || '') + ' ' + (v.sub || ''))}${vitem('年款', v.year)}
        ${vitem('VIN 前缀', v.prefix)}${vitem('排量', v.cap)}${vitem('功率', v.kw)}${vitem('发动机', v.engine)}
        ${vitem('车身', v.body)}${vitem('燃料', v.fuel)}${vitem('驱动', v.drive)}${vitem('vid', v.vid)}
      </div>`;
    } else {
      html += `<div class="hint" style="margin-top:8px">vid ${esc(m.vid)} 未在车型库中找到对应车型</div>`;
    }
    html += `</div>`;
  });
  out.innerHTML = html;
}
