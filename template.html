// 产品管理：渲染全部产品表格（仅显示有 CDAP 或 OE 号的产品，懒加载分批渲染）
let PM_ALL_ROWS = [];
let PM_VISIBLE_ROWS = [];
let PM_ALL_IDX = 0;
const PM_ALL_BATCH = 300;
let PM_ALL_BOUND = false;
function renderPmAllProducts(){
  const wrap = document.getElementById('pmAllWrap');
  const cnt = document.getElementById('pmAllCount');
  if(!wrap) return;
  if(!PRODUCTS_READY){
    wrap.innerHTML = '<div class="empty">产品数据加载中…</div>';
    if(cnt) cnt.textContent = '…';
    return;
  }
  // 仅保留有 CDAP 或 OE 号的产品（产品经理仅显示其管理品类），并按 OE+CDAP 去重聚合关联车型
  const rawRows = [];
  Object.keys(PRODUCTS).forEach(vid => {
    (PRODUCTS[vid]||[]).forEach(p => {
      if(String(p.cdap||'').trim() !== '' || String(p.oe||'').trim() !== ''){
        if(!inMyCats(p.grp)) return;
        rawRows.push(Object.assign({}, p, {_vid: vid}));
      }
    });
  });
  const merged = new Map();
  rawRows.forEach(p => {
    const oe = String(p.oe || '').trim().toLowerCase();
    const cd = String(p.cdap || '').trim().toLowerCase();
    const key = oe + '|' + cd;
    if(!merged.has(key)){
      merged.set(key, Object.assign({}, p, {_vids: [p._vid], _pids: [p.id], rel_count: 1}));
    } else {
      const m = merged.get(key);
      if(!m._vids.includes(p._vid)) m._vids.push(p._vid);
      if(!m._pids.includes(p.id)) m._pids.push(p.id);
      m.rel_count = m._vids.length;
    }
  });
  PM_ALL_ROWS = Array.from(merged.values());
  // 按 OE / CDAP 号过滤下方表格
  const q = (PM_FILTER_Q || '').trim().toLowerCase();
  if(q){
    PM_VISIBLE_ROWS = PM_ALL_ROWS.filter(p => {
      const oe = String(p.oe || '').toLowerCase();
      const cd = String(p.cdap || '').toLowerCase();
      const ic = String(p.interchange || '').toLowerCase();
      return oe.includes(q) || cd.includes(q) || ic.includes(q);
    });
  } else {
    PM_VISIBLE_ROWS = PM_ALL_ROWS.slice();
  }
  if(cnt) cnt.textContent = PM_VISIBLE_ROWS.length;
  if(!PM_VISIBLE_ROWS.length){
    wrap.innerHTML = myCats() !== null && myCats().length === 0
      ? '<div class="empty">你尚未被分配任何管理品类</div>'
      : (q ? `<div class="empty">未找到匹配「${esc(PM_FILTER_Q)}」的产品</div>` : '<div class="empty">暂无带 OE / CDAP 号码的产品</div>');
    return;
  }
  wrap.innerHTML = '<table><thead><tr>'
    + '<th>品名</th><th>英文名</th><th>品牌</th><th>OE 号</th><th>CDAP</th><th>互换号</th><th>位置</th><th>供应商</th><th>MOQ</th><th>采购价</th><th>操作</th>'
    + '</tr></thead><tbody id="pmAllBody"></tbody></table>';
  PM_ALL_IDX = 0;
  appendPmAllBatch();
  fillPmAllIfNeeded(wrap);
  bindPmAllScroll(wrap);
}
function appendPmAllBatch(){
  const body = document.getElementById('pmAllBody');
  if(!body) return;
  const c = v => esc(v || '');
  const end = Math.min(PM_ALL_IDX + PM_ALL_BATCH, PM_VISIBLE_ROWS.length);
  let html = '';
  for(let i = PM_ALL_IDX; i < end; i++){
    const p = PM_VISIBLE_ROWS[i];
    html += `<tr data-pid="${p.id}" data-idx="${i}">`
      + `<td>${c(p.cn)}</td>`
      + `<td>${c(p.en)}</td>`
      + `<td>${c(p.brand)}</td>`
      + `<td class="mono">${c(p.oe)}</td>`
      + `<td class="mono">${c(p.cdap)}</td>`
      + `<td class="mono">${c((p.interchange||'').split(',').join(', '))}</td>`
      + `<td>${c(p.loc)}</td>`
      + `<td>${c(p.supplier)}</td>`
      + `<td>${c(p.moq)}</td>`
      + `<td>${c(p.cost)}</td>`
      + `<td class="pm-ops">`
      + `<button type="button" class="btn ghost sm" onclick="openPmEdit(${p.id})">编辑</button> `
      + `<button type="button" class="btn ghost sm" onclick="openPmRel(${p.id})">关联车型${(p.rel_count||1) > 1 ? ' (' + p.rel_count + ')' : ''}</button>`
      + `</td>`
      + '</tr>';
  }
  body.insertAdjacentHTML('beforeend', html);
  PM_ALL_IDX = end;
}
function fillPmAllIfNeeded(wrap){
  let guard = 0;
  while(PM_ALL_IDX < PM_VISIBLE_ROWS.length && wrap.scrollHeight <= wrap.clientHeight + 2 && guard < 200){
    appendPmAllBatch();
    guard++;
  }
}
function bindPmAllScroll(wrap){
  if(PM_ALL_BOUND) return;
  PM_ALL_BOUND = true;
  wrap.addEventListener('scroll', () => {
    if(PM_ALL_IDX >= PM_VISIBLE_ROWS.length) return;
    if(wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 60){
      appendPmAllBatch();
      fillPmAllIfNeeded(wrap);
    }
  });
}

// ---- 产品管理：编辑产品弹窗（品牌/OE/CDAP/供应商/MOQ/采购价） ----
let PM_EDIT_PID = null;
function pmFindProduct(pid){
  for(const p of (PM_ALL_ROWS||[])){ if(p.id === pid) return p; }
  return null;
}
function openPmEdit(pid){
  const p = pmFindProduct(pid);
  if(!p) return;
  if(!inMyCats(p.grp)){ alert('无权修改该品类下的产品'); return; }
  PM_EDIT_PID = pid;
  document.getElementById('pmEditTitle').textContent = '编辑产品：' + (p.cn || '未命名');
  document.getElementById('pmEditCn').value = p.cn || '';
  document.getElementById('pmEditBrand').value = p.brand || '';
  document.getElementById('pmEditOe').value = p.oe || '';
  document.getElementById('pmEditInterchange').value = p.interchange || '';
  document.getElementById('pmEditCdap').value = p.cdap || '';
  document.getElementById('pmEditSupplier').value = p.supplier || '';
  document.getElementById('pmEditMoq').value = p.moq || '';
  document.getElementById('pmEditCost').value = p.cost || '';
  document.getElementById('pmEditModal').classList.add('show');
}
function pmHideEdit(){
  document.getElementById('pmEditModal').classList.remove('show');
  PM_EDIT_PID = null;
}
async function pmSaveEdit(){
  if(PM_EDIT_PID == null) return;
  const p = pmFindProduct(PM_EDIT_PID);
  if(!p) return;
  if(!inMyCats(p.grp)){ alert('无权修改该品类下的产品'); return; }
  const payload = {
    id: PM_EDIT_PID,
    vid: p._vid || '',
    grp: p.grp || '',
    cn: p.cn || '',
    en: p.en || '',
    notes: p.notes || '',
    brand: (document.getElementById('pmEditBrand').value || '').trim(),
    oe: (document.getElementById('pmEditOe').value || '').trim(),
    interchange: (document.getElementById('pmEditInterchange').value || '').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean).join(','),
    cdap: (document.getElementById('pmEditCdap').value || '').trim(),
    supplier: (document.getElementById('pmEditSupplier').value || '').trim(),
    cost: (document.getElementById('pmEditCost').value || '').trim(),
    moq: (document.getElementById('pmEditMoq').value || '').trim()
  };
  try{
    const r = await fetch('/api/products', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    const d = await r.json();
    if(!d || !d.ok){ alert('保存失败：' + ((d&&d.error)||'未知错误')); return; }
    p.brand = payload.brand; p.oe = payload.oe; p.cdap = payload.cdap; p.interchange = payload.interchange;
    p.supplier = payload.supplier; p.cost = payload.cost; p.moq = payload.moq;
    const tr = document.querySelector('#pmAllBody tr[data-pid="'+PM_EDIT_PID+'"]');
    if(tr){
      tr.children[2].innerHTML = esc(p.brand);
      tr.children[3].innerHTML = '<span class="mono">'+esc(p.oe)+'</span>';
      tr.children[4].innerHTML = '<span class="mono">'+esc((p.interchange||'').split(',').join(', '))+'</span>';
      tr.children[5].innerHTML = '<span class="mono">'+esc(p.cdap)+'</span>';
      tr.children[6].innerHTML = esc(p.loc);
      tr.children[7].innerHTML = esc(p.supplier);
      tr.children[8].innerHTML = esc(p.moq);
      tr.children[9].innerHTML = esc(p.cost);
    }
    pmHideEdit();
  }catch(e){ alert('保存失败：' + e); }
}
// 删除产品（仅允许无关联车型的产品）
async function pmDeleteProduct(){
  if(PM_EDIT_PID == null) return;
  const p = pmFindProduct(PM_EDIT_PID);
  if(!p) return;
  if(!inMyCats(p.grp)){ alert('无权删除该品类下的产品'); return; }
  // 检查关联车型数量
  try{
    const r = await fetch('/api/product-vehicles-by-code?oe=' + encodeURIComponent(p.oe||'') + '&cdap=' + encodeURIComponent(p.cdap||''));
    const d = await r.json();
    const vehicles = (d && d.vehicles) || [];
    if(vehicles.length > 0){
      alert('该产品还有 ' + vehicles.length + ' 个关联车型，请先解除所有关联后再删除');
      return;
    }
  }catch(e){ /* 继续尝试删除 */ }
  const name = p.cn || p.en || '该产品';
  if(!confirm('确定要删除「' + name + '」吗？此操作不可撤销。')) return;
  try{
    const r = await fetch('/api/products', {method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: PM_EDIT_PID, vid: p.vid||''})});
    const d = await r.json();
    if(!d || !d.ok){ alert('删除失败：' + ((d&&d.error)||'未知错误')); return; }
    // 从表格移除行
    const tr = document.querySelector('#pmAllBody tr[data-pid="'+PM_EDIT_PID+'"]');
    if(tr) tr.remove();
    pmHideEdit();
  }catch(e){ alert('删除失败：' + e); }
}

// ---- 产品管理：关联车型弹窗（查看/新增/删除） ----
let PM_REL_PID = null;
let PM_REL_OE = '';
let PM_REL_CDAP = '';
function vehByVid(vid){
  for(const r of (DATA||[])){ if(String(r.vid) === String(vid)) return r; }
  return null;
}
function openPmRel(pid){
  const p = pmFindProduct(pid);
  if(!p) return;
  if(!inMyCats(p.grp)){ alert('无权管理该品类产品的关联车型'); return; }
  PM_REL_PID = pid;
  PM_REL_OE = p.oe || '';
  PM_REL_CDAP = p.cdap || '';
  const relCount = (p._vids && p._vids.length) || 1;
  document.getElementById('pmRelTitle').textContent = '关联车型：' + (p.cn || '未命名') + '（' + relCount + ' 个车型）';
  document.getElementById('pmRelInput').value = '';
  document.getElementById('pmRelModal').classList.add('show');
  pmLoadRel();
}
function pmHideRel(){
  document.getElementById('pmRelModal').classList.remove('show');
  PM_REL_PID = null;
  PM_REL_OE = '';
  PM_REL_CDAP = '';
}
async function pmLoadRel(){
  if(PM_REL_PID == null) return;
  const list = document.getElementById('pmRelList');
  list.innerHTML = '<li class="pm-rel-empty">加载中…</li>';
  try{
    const r = await fetch('/api/product-vehicles-by-code?oe=' + encodeURIComponent(PM_REL_OE) + '&cdap=' + encodeURIComponent(PM_REL_CDAP));
    const d = await r.json();
    const arr = (d && d.vehicles) || [];
    if(!arr.length){
      list.innerHTML = '<li class="pm-rel-empty">该产品暂未关联任何车型</li>';
      return;
    }
    list.innerHTML = arr.map(v => {
      const rec = vehByVid(v.vid);
      const meta = rec ? `<b>${esc(rec.brand||'')}</b> ${esc(rec.model||'')}${rec.sub?(' / '+esc(rec.sub)):''}` : '（车型库未匹配）';
      const remark = v.remark ? esc(v.remark) : '';
      const vq = (v.vid||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const rq = remark.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const editBtn = `<button type="button" class="btn ghost sm" onclick="pmEditRelRow('${vq}','${rq}',${v.owner})">编辑</button>`;
      return `<li class="pm-rel-item" id="pmrel_${vq}"><span class="pm-rel-vid">${esc(v.vid)}</span><span class="pm-rel-meta">${meta}</span><span class="pm-rel-remark">${remark || '<span style="color:#c0c0c0">&nbsp;</span>'}</span><span class="pm-rel-act">${editBtn}</span></li>`;
    }).join('');
  }catch(e){
    list.innerHTML = '<li class="pm-rel-empty">加载失败：' + esc(e) + '</li>';
  }
}

  if(!row) return;
  const rec = vehByVid(vid);
  const meta = rec ? `${esc(rec.brand||'')} ${esc(rec.model||'')}${rec.sub?(' / '+esc(rec.sub)):''}` : '';
  row.innerHTML = `
    <span class="pm-rel-vid">${esc(vid)}</span>
    <span class="pm-rel-meta"><b>${esc(rec?.brand||'')}</b> ${esc(meta)}</span>

      <input id="pmre_${vid}" class="pm-rel-input" placeholder="车型备注" value="${esc(remark)}" />
      <button type="button" class="btn sm pm-rel-unlink-btn" onclick="pmUnlinkRel('${vid.replace(/'/g,"\\'")}')">解除关联</button>
    </span>
    <span class="pm-rel-act">
      <button type="button" class="btn sm" onclick="pmSaveRelRow('${vid.replace(/'/g,"\\'")}',${isOwner})">保存</button>

async function pmSaveRelRow(vid, wasOwner){
  if(PM_REL_PID == null) return;
  const remarkInput = document.getElementById('pmre_'+vid);
  const remark = (remarkInput ? remarkInput.value : '').trim();
  // 保存备注
  try{
    const r = await fetch('/api/product-vehicle-remark', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pid: PM_REL_PID, vid: vid, remark: remark})});
    const d = await r.json();
    if(!d || !d.ok){ alert('保存备注失败：' + ((d&&d.error)||'未知错误')); return; }
  }catch(e){ alert('保存失败：' + e); return; }
  await pmLoadRel();
}
// 解除关联（点即生效）
async function pmUnlinkRel(vid){
  if(PM_REL_PID == null) return;
  if(!confirm('确定要解除该车型（'+vid+'）与产品的关联吗？')) return;
  try{
    const r = await fetch('/api/product-vehicles', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: PM_REL_PID, vid: vid, action:'delete'})});
    const d = await r.json();
    if(!d || !d.ok){ alert('解除关联失败：' + ((d&&d.error)||'未知错误')); return; }
    await pmLoadRel();
  }catch(e){ alert('操作失败：' + e); }
}
function pmCancelRelRow(vid, remark, isOwner){
  // 直接重新渲染该行为只读模式（从当前状态恢复）
  pmLoadRel();
}
async function pmAddRel(){
  if(PM_REL_PID == null) return;
  const inp = document.getElementById('pmRelInput');
  const vid = (inp.value || '').trim();
  if(!vid) return;
  try{
    const r = await fetch('/api/product-vehicles', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: PM_REL_PID, vid: vid, action:'add'})});
    const d = await r.json();
    if(!d || !d.ok){ alert('添加失败：' + ((d&&d.error)||'未知错误')); return; }

// ---- 字段筛选：MAKE/MODEL/Sub Model/YEAR/Capacity/ENGINE/CHASSIS/SERIES 多字段 AND 组合 ----
// 基于已加载的 DATA 进行筛选（前端即时，199 条无需服务端往返；未来数据量增大可下沉到 /api/vehicles）
async function queryByAttrs(){
  // 互斥：清空 VIN 码查询结果 + 关闭已展开的产品区
  const outS = document.getElementById('outS'); if(outS) outS.innerHTML = '';
  const prods = document.getElementById('cardsProds');
  if(prods){ prods.classList.remove('open'); prods.innerHTML=''; prods.dataset.vid=''; }
  document.querySelectorAll('.vcard-vin.active').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.vcard:not(.vcard-vin).active').forEach(c => c.classList.remove('active'));
  const out = document.getElementById('outF');
  if(!out) return;
  
  // Collect filter values
  const regionVal = (document.getElementById('fRegion')?.value || '').trim();
  const brandVal = (document.getElementById('fMake')?.value || '').trim();
  
  const items = [
    ['MODEL',   (document.getElementById('fModel')  .value || '').trim().toUpperCase(),    r => String(r.model   || '').toUpperCase()],
    ['SubModel',(document.getElementById('fSub')    .value || '').trim().toUpperCase(),    r => String(r.sub     || '').toUpperCase()],
    ['YEAR',    (document.getElementById('fYear')   .value || '').trim(),                  r => String(r.year    || '')],
    ['Capacity',(document.getElementById('fCap')    .value || '').trim().toUpperCase(),    r => String(r.cap     || '').toUpperCase()],
    ['ENGINE',  (document.getElementById('fEngine') .value || '').trim().toUpperCase(),    r => String(r.engine  || '').toUpperCase()],
    ['CHASSIS', (document.getElementById('fChassis').value || '').trim().toUpperCase(),    r => String(r.chassis || '').toUpperCase()],
    ['SERIES',  (document.getElementById('fSeries') .value || '').trim().toUpperCase(),    r => String(r.series  || '').toUpperCase()],
    ['POWER',   (document.getElementById('fKw')     .value || '').trim().toUpperCase(),    r => String(r.kw      || '').toUpperCase()],
    ['BODY',    (document.getElementById('fBody')   .value || '').trim().toUpperCase(),    r => String(r.body    || '').toUpperCase()],
    ['FUEL',    (document.getElementById('fFuel')   .value || '').trim().toUpperCase(),    r => String(r.fuel    || '').toUpperCase()],
    ['DRIVE',   (document.getElementById('fDrive')  .value || '').trim().toUpperCase(),    r => String(r.drive   || '').toUpperCase()],
    ['TRANS',   (document.getElementById('fTrans')  .value || '').trim().toUpperCase(),    r => String(r.transmission || '').toUpperCase()],
    ['ORIGIN',  (document.getElementById('fOrigin') .value || '').trim().toUpperCase(),    r => String(r.origin  || '').toUpperCase()],
  ].filter(([_, v]) => v);

  if(!regionVal && !brandVal && !items.length){
    out.innerHTML = '<div class="empty">请至少填写一个字段</div>';
    return;
  }
  
  // Build server query: use region + brand to narrow down, then filter other fields client-side
  const params = new URLSearchParams({limit: '-1', offset: '0'});
  if(regionVal) params.set('region', regionVal);
  if(brandVal) params.set('brand', brandVal);
  
  out.innerHTML = '<div class="loading">搜索中...</div>';
  
  let serverData = [];
  try {
    const resp = await fetch('/api/vehicles?' + params.toString());
    const d = await resp.json();
    if(!d.ok){ out.innerHTML = '<div class="empty">搜索失败：' + esc(d.error || '未知错误') + '</div>'; return; }
    serverData = d.vehicles || [];
  } catch(e) {
    out.innerHTML = '<div class="empty">搜索请求失败：' + esc(e.message) + '</div>';
    return;
  }
  
  // Further filter client-side for exact field matches
  const filtered = serverData.filter(r => items.every(([k, v, get]) => {
    if(k === 'YEAR') return yearMatch(v, r);
    const val = get(r);
    return !!(val && val.includes(v));
  }));
  
  const hint = document.getElementById('fldHint');
  hint.textContent = '';

  if(!filtered.length){
    out.innerHTML = '<div class="cards-empty">未找到匹配车型。可清空部分条件后再试</div>';
    const p = document.getElementById('cardsProds'); if(p){ p.classList.remove('open'); p.innerHTML=''; }
    updateResultCount(0);
    return;
  }
  // 卡片渲染：每条车型一张竖直卡片，行高与左侧字段严格对齐（VID/MAKE/MODEL/Sub Model/YEAR/Capacity/ENGINE/CHASSIS/VIN 前缀）
  const showV = (val) => val ? esc(val) : '<span class="empty-v">—</span>';
  out.innerHTML = filtered.map((r) => {
    return `<div class="vcard" data-vid="${esc(r.vid)}" onclick="toggleCardProds('${esc(r.vid)}', this)">
      <div class="vc-vid" title="VID ${esc(r.vid)}">VID ${esc(r.vid)}</div>
      <div class="vc-rows">
        <div class="vc-row" title="${esc(r.brand)}">${showV(r.brand)}</div>
        <div class="vc-row" title="${esc(r.model)}">${showV(r.model)}</div>
        <div class="vc-row" title="${esc(r.sub)}">${showV(r.sub)}</div>
        <div class="vc-row" title="${esc(r.year)}">${showV(r.year)}</div>
        <div class="vc-row" title="${esc(r.cap)}">${showV(r.cap)}</div>
        <div class="vc-row" title="${esc(r.engine)}">${showV(r.engine)}</div>
        <div class="vc-row" title="${esc(r.chassis)}">${showV(r.chassis)}</div>
        <div class="vc-row" title="${esc(r.series)}">${showV(r.series)}</div>
        <div class="vc-row" title="${esc(r.kw)}">${showV(r.kw)}</div>
        <div class="vc-row" title="${esc(r.body)}">${showV(r.body)}</div>
        <div class="vc-row" title="${esc(r.fuel)}">${showV(r.fuel)}</div>
        <div class="vc-row" title="${esc(r.drive)}">${showV(r.drive)}</div>
        <div class="vc-row" title="${esc(r.transmission)}">${showV(r.transmission)}</div>
        <div class="vc-row" title="${esc(r.origin)}">${showV(r.origin)}</div>
      </div>
      <div class="vc-vinprefix" title="${esc(r.prefix)}">${showV(r.prefix)}</div>
    </div>`;
  }).join('');
  // 隐藏上次展开的产品（仅清字段筛选侧的高亮，不影响 VIN 侧）
  const pp = document.getElementById('cardsProds');
  if(pp){ pp.classList.remove('open'); pp.innerHTML=''; pp.dataset.vid=''; }
  document.querySelectorAll('.vcard:not(.vcard-vin).active').forEach(c => c.classList.remove('active'));
  updateResultCount(filtered.length);
}

// 点击卡片展开/收起该车型关联的产品
function toggleCardProds(vid, cardEl){
  const target = document.getElementById('cardsProds');
  if(!target) return;
  const prods = filterProdsForVid(vid);
  // 允许展开空产品面板：无产品车型也可点击选中，便于从左侧品类树「＋」添加产品
  const sameOpen = target.classList.contains('open') && target.dataset.vid === String(vid);
  // 只清理右侧（字段筛选）侧的高亮，不影响 VIN 命中侧
  document.querySelectorAll('.vcard:not(.vcard-vin).active').forEach(c => c.classList.remove('active'));
  if(sameOpen){
    target.classList.remove('open');
    target.innerHTML = '';
    target.dataset.vid = '';
    cardEl.classList.remove('active');
    return;
  }
  target.classList.add('open');
  target.dataset.vid = vid;
  renderActiveProds(vid);
  cardEl.classList.add('active');
}

// YEAR 匹配：year 字符串包含（如输入 2024 命中 "07/2024 ~ on"）或落在 ys~ye 区间
function yearMatch(v, r){
  const txt = String(r.year || '');
  if(txt && txt.includes(v)) return true;
  return yearHitsRange(v, r);
}

// YEAR 字段兜底：解析数字，落在车型记录 ys~ye 区间也视为命中
function yearHitsRange(yearStr, r){
  const y = parseInt(yearStr, 10);
  if(isNaN(y)) return false;
  const ys = (r.ys === 0 || r.ys) ? Number(r.ys) : null;
  const ye = (r.ye === 0 || r.ye) ? Number(r.ye) : null;
  if(ys === null && ye === null) return false;
  const lo = ys === null ? -9999 : ys - 1;
  const hi = ye === null ? 9999  : ye + 1;
  return y >= lo && y <= hi;
}

let _filterDebounce = null;
let _filterCache = {};  // 缓存上次加载的选项
let _activeDropdown = null;  // 当前打开的下拉面板
let _activeInput = null;

// 根据输入框ID判断使用哪个MAP
function getFilterMap(inputId) {
  if (inputId && inputId.startsWith('ef')) return FILTER_MAP_EDIT;
  return FILTER_MAP;
}

// 初始化清除按钮（两个页面都初始化）
function initFilterClearButtons() {
  [FILTER_MAP, FILTER_MAP_EDIT].forEach(map => {
    map.forEach(item => {
      const input = document.getElementById(item.id);
      if (!input) return;
      const wrap = input.closest('.filter-input-wrap');
      if (!wrap) return;
      
      // 创建清除按钮
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-clear-btn';
      btn.innerHTML = '×';
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        input.value = '';
        wrap.classList.remove('has-value');
        onFilterChange(true, getFilterMap(item.id));
        input.focus();
      });
      wrap.appendChild(btn);
      
      // 监听输入变化
      input.addEventListener('input', () => {
        wrap.classList.toggle('has-value', input.value.trim().length > 0);
      });
    });
  });
}

function onFilterChange(immediate, map){
  if (!map) map = FILTER_MAP;
  clearTimeout(_filterDebounce);
  const doFetch = async () => {
    // 收集当前所有筛选值
    const filters = {};
    map.forEach(item => {
      const v = (document.getElementById(item.id)?.value || '').trim();
      if(v) filters[item.field] = v;
    });
    // 请求服务端级联选项
    const params = new URLSearchParams(filters);
    try {
      const r = await fetch('/api/filter-options?' + params.toString());
      const d = await r.json();
      if(!d.ok) return;
      const opts = d.options || {};
      _filterCache = opts;
      
      // 产品编辑页：根据用户地区组过滤 region 下拉选项
      const isEditMap = (map === FILTER_MAP_EDIT);
      const rg = isEditMap ? myRegionGroup() : null;
      
      // 更新每个下拉面板
      map.forEach(item => {
        const dd = document.getElementById(item.ddId);
        if(!dd) return;
        let values = opts[item.field] || [];
        
        // 产品编辑页的 region 字段权限过滤
        if(isEditMap && item.field === 'region' && rg) {
          if(rg === 'CDC') {
            values = values.filter(v => v === '澳新地区');
          } else if(rg === 'CDI') {
            values = values.filter(v => v !== '澳新地区');
          }
        }
        
        // 取当前输入值做前缀过滤（联想）
        const curVal = (document.getElementById(item.id)?.value || '').trim().toLowerCase();
        const filtered = curVal ? values.filter(v => v.toLowerCase().includes(curVal)) : values;
        dd.innerHTML = filtered.map(v => `<div class="filter-dropdown-item" onmousedown="pickFilter('${item.id}','${esc(v).replace(/'/g,"\\'")}')">${esc(v)}</div>`).join('');
      });
    } catch(e) { /* 静默失败 */ }
  };
  if(immediate) doFetch();
  else _filterDebounce = setTimeout(doFetch, 300);
}

// 点击下拉选项
function pickFilter(inputId, value){
  const inp = document.getElementById(inputId);
  if(inp) {
    inp.value = value;
    const wrap = inp.closest('.filter-input-wrap');
    if(wrap) wrap.classList.add('has-value');
  }
  closeAllDropdowns();
  onFilterChange(true, getFilterMap(inputId));
}

// 显示下拉面板
function onFilterFocus(inputId){
  const map = getFilterMap(inputId);
  const ddId = map.find(m => m.id === inputId)?.ddId;
  if(!ddId) return;
  const dd = document.getElementById(ddId);
  if(!dd) return;
  
  closeAllDropdowns();
  
  // 立即显示下拉并显示加载状态
  dd.innerHTML = '<div class="filter-dropdown-item" style="color:#999">加载中...</div>';
  dd.classList.add('show');
  _activeDropdown = dd;
  _activeInput = document.getElementById(inputId);
  
  // 加载选项
  onFilterChange(true, map);
}

// 关闭所有下拉
function closeAllDropdowns(){
  document.querySelectorAll('.filter-dropdown.show').forEach(el => el.classList.remove('show'));
  _activeDropdown = null;
  _activeInput = null;
}

// 点击页面其他地方关闭下拉（排除当前激活的输入框和下拉面板）

function queryOne(){
  // 互斥：清空车型查询（字段筛选）结果
  const outF = document.getElementById('outF'); if(outF) outF.innerHTML = '';
  const fldHint = document.getElementById('fldHint'); if(fldHint) fldHint.textContent = '';

  const hints    = document.getElementById('vinHints');
  const cardsBox = document.getElementById('outS');
  const prodsBox = document.getElementById('cardsProds');
  const vpicBox  = document.getElementById('vpicOut');
  const vpicBtn  = document.getElementById('vpicBtnBox');
  if(prodsBox){ prodsBox.classList.remove('open'); prodsBox.innerHTML=''; prodsBox.dataset.vid=''; }
  if(vpicBox){ vpicBox.innerHTML=''; }
  if(vpicBtn){ vpicBtn.innerHTML=''; }
  document.querySelectorAll('.vcard-vin.active').forEach(c => c.classList.remove('active'));

  const raw = (document.getElementById('vin').value || '').trim();
  // ===== 新增：VID 精确查询（VID 为纯数字，如 62036）—— 优先于 VIN 前缀匹配 =====
  if(raw){
    const vidHits = ALL().filter(r => String(r.vid) === raw);
    if(vidHits.length){
      cardsBox.innerHTML = vidHits.map(candCard).join('');
      updateResultCount(vidHits.length);
      hints.innerHTML = `<div class="msg m-ok">按 VID 精确匹配到 <b>${vidHits.length}</b> 条车型${vidHits.length>1?'（同名多配置）':''}</div>`;
      if(vpicBtn) vpicBtn.innerHTML = '';
      return;
    }
  }

  const vin = normVin(raw);
  if(!vin){ hints.innerHTML = '<div class="empty">请输入 VIN 码或 VID（如 62036）</div>'; cardsBox.innerHTML=''; updateResultCount(0); return; }

  const val = validateVin(vin);
  const r = match(vin);
  window._lastR = r;

  let msgHtml = '';
  if(vin.length === 17){
    msgHtml += vinStrip(vin);
  }
  if(!val.ok){
    msgHtml += `<div class="msg m-err">${val.msg} —— 仍按前缀尝试匹配：</div>`;
  }

  // ===== 收集候选车型 → 注入 #outS（共用下方 cards-wrap） =====
  // 地区组权限过滤：VIN 匹配结果也受地区限制
  const _rg = myRegionGroup();
  if(_rg && r.candidates.length){
    const beforeCount = r.candidates.length;
    r.candidates = r.candidates.filter(c => canEditRegion(c.region));
    // 精确命中也要过滤
    if(r.exact && !canEditRegion(r.exact.region)) r.exact = null;
    // 仅当还有剩余候选时显示隐藏数量提示；全部被过滤时由下方红色提示统一说明
    if(r.candidates.length > 0 && r.candidates.length < beforeCount){
      const removed = beforeCount - r.candidates.length;
      msgHtml += `<div class="msg m-info" style="font-size:12px">${removed} 条候选因不在你可编辑的地区范围内已隐藏</div>`;
    }
  }
  const collectRecs = (() => {
    if(!r.candidates.length) return { main: [], leftover: [] };
    const main = []; const leftover = []; const usedVid = new Set();
    if(r.exact){ main.push(r.exact); usedVid.add(r.exact.vid); }
    else if(typeof r.vds === 'string'){
      const c = pickBestCandidate(r.vds, r.candidates);
      if(c){ main.push(c); usedVid.add(c.vid); }
    } else if(Array.isArray(r.vds)){
      r.vds.forEach(entry => {
        const c = pickBestCandidate(entry, r.candidates.filter(x => !usedVid.has(x.vid)));
        if(c){ usedVid.add(c.vid); main.push(c); }
      });
      r.candidates.filter(x => !usedVid.has(x.vid)).forEach(x => leftover.push(x));
    } else {
      r.candidates.forEach(x => { main.push(x); usedVid.add(x.vid); });
    }
    return { main, leftover };
  })();

  if(!collectRecs.main.length && !collectRecs.leftover.length){
    msgHtml += `<div class="msg m-err"><b>未匹配到车型。</b>`;
    if(r.wmiBrand) msgHtml += ` 该 VIN 的 WMI（${vin.slice(0,3)}）属于库内品牌 <b>${r.wmiBrand}</b>，但此具体车型未收录，建议补充车型库。`;
    else if(r.wmiName) msgHtml += ` 按 WMI 规则识别为 <b>${r.wmiName}</b>（产地 ${r.country||'未知'}），但该厂商不在你的车型库覆盖范围内。`;
    else msgHtml += ` WMI（${vin.slice(0,3)}）不在你的车型库覆盖范围内，公开 WMI 规则中也未收录。`;
    msgHtml += '</div>';
    cardsBox.innerHTML = '';
    updateResultCount(0);
  } else {
    const allRecs = collectRecs.main.concat(collectRecs.leftover);
    cardsBox.innerHTML = allRecs.map(candCard).join('');
    updateResultCount(allRecs.length);
    if(collectRecs.leftover.length && collectRecs.main.length){
      msgHtml += `<div class="msg m-info" style="font-size:12px">另有 ${collectRecs.leftover.length} 条库内记录未匹配 VDS 判定，已并入卡片尾部，仅作参考</div>`;
    }
  }

  // 17 位 VIN 时在“查询”按钮右侧追加 NHTSA 联网核对按钮
  if(vin.length === 17){
    if(vpicBtn) vpicBtn.innerHTML = `<button class="btn" onclick="vpicCheck('${vin}')">联网官方核对（NHTSA 美国交通部）</button>`;
  } else if(vpicBtn){
    vpicBtn.innerHTML = '';
  }

  hints.innerHTML = msgHtml;
}

// 联网核对：同源代理 /api/vpic 调 NHTSA vPIC 官方库（NHTSA 不开放 CORS，故服务端代理）
function vpicCheck(vin){
  const box = document.getElementById('vpicOut');
  if(!box) return;
  box.innerHTML = '<div class="hint">查询 NHTSA 官方库中…</div>';
  fetch('/api/vpic?vin=' + vin).then(r => r.json()).then(d => {
    if(!d.ok){ box.innerHTML = `<div class="msg m-err">官方查询失败：${esc(d.error||'')}</div>`; return; }
    if(!d.make){
      box.innerHTML = `<div class="msg m-warn"><b>NHTSA 无此 VIN 数据</b> —— 多为中国/澳洲等未在美注册车型。请以本工具"车型系列码（真实 VIN 样本）"或车型库为参考，并交叉核对实车铭牌。</div>`;
      return;
    }
    let badge = '';
    const r = window._lastR;
    if(r && r.candidates.length){
      const tbl = (r.candidates[0].brand || '').toUpperCase();
      const off = (d.make || '').toUpperCase();
      if(tbl && (off.includes(tbl) || tbl.includes(off))) badge = '<span class="badge b-ok">与车型库一致</span>';
      else badge = `<span class="badge b-err">⚠ 与车型库不符：库内=${esc(r.candidates[0].brand)} / 官方=${esc(d.make)}</span>`;
    }
    box.innerHTML = `<div class="msg m-info" style="margin-top:10px"><b>官方数据库（NHTSA vPIC · 美国交通部）</b> ${badge}</div>
      <div class="vgrid">${vitem('厂商', d.make)}${vitem('车型', d.model)}${vitem('年款', d.modelYear)}${vitem('配置', d.trim)}${vitem('系列', d.series)}${vitem('发动机', d.engineModel)}${vitem('排量(L)', d.displacementL)}${vitem('燃料', d.fuelType)}${vitem('车身', d.bodyClass)}${vitem('驱动', d.driveType)}${vitem('产国', d.plantCountry)}</div>`;
  }).catch(e => { box.innerHTML = `<div class="msg m-err">网络错误：${esc(e.message)}</div>`; });
}

// 页面启动：先从服务器拉元信息（VDS/品牌/总数，首屏不再带 1.5MB 产品），再分页拉首屏 200 条车型；
// 产品型号由 loadProductsLazy() 后台静默加载，产品树由 loadProdTree() 独立立即加载。
async function bootstrap(){
  try{
    const r = await fetch('/api/data?products=0');
    const d = await r.json();
    META = d.META || {};
    PRODUCTS = {};               // 产品型号改为懒加载，首屏置空
    PRODUCTS_READY = false;
    VDS_MAP = d.VDS_MAP || {};
    VDS_SRC = d.VDS_SRC || {};
    DATA = [];
    VEH_TOTAL = 0;
    await fetchVehiclePage(false);
  }catch(e){
    document.body.insertAdjacentHTML('afterbegin',
      `<div class="msg m-err" style="margin:10px">无法连接服务器（/api/data）：${esc(e.message)}</div>`);
    DATA = []; META = {}; PRODUCTS = {}; PRODUCTS_READY = false; VDS_MAP = {}; VDS_SRC = {}; VEH_TOTAL = 0;
  }
  init();
  loadProductsLazy();   // 后台静默加载产品型号（不阻塞首屏）
}

// 产品型号懒加载：后台拉 /api/products（~1.5MB），就绪后刷新依赖产品的视图
let _prodLoadPromise = null;
function loadProductsLazy(force){
  if(PRODUCTS_READY && !force) return _prodLoadPromise || Promise.resolve();
  if(!_prodLoadPromise){
    _prodLoadPromise = (async () => {
      try{
        const r = await fetch('/api/products');
        const d = await r.json();
        if(d && d.ok && d.products){
          PRODUCTS = d.products;
          PRODUCTS_READY = true;
        }
      }catch(e){ /* 静默失败，下次渲染时再试 */ }
      // 就绪后刷新当前展示的产品视图
      const out = document.getElementById('cardsProds');
      if(out && out.dataset.vid) renderActiveProds(out.dataset.vid);
      const eout = document.getElementById('ecardsProds');
      if(eout && eout.dataset.vid) renderEditProds(eout.dataset.vid);
      // 弹窗版产品编辑已移除（迁到 paneEdit）
    })().finally(() => { _prodLoadPromise = null; });
  }
  return _prodLoadPromise;
}

// ================= 登录与权限 =================
let CURRENT_USER = null;
const ROLE_NAMES = {admin:'管理员', pm:'产品经理', user:'用户'};
// 产品经理可分配的管理品类选项（动态从 CATS 生成）
function getPmCatOptions(){
  if(!CATS || !CATS.length) return [];
  // 构建层级路径显示：如 "A > A1 > 驱动端盖"
  const byCode = {};
  CATS.forEach(c => { byCode[c.code] = c; });
  return CATS.map(c => {
    const path = [];
    let cur = c;
    while(cur){
      path.unshift(cur.cn || cur.code);
      cur = cur.parent_code ? byCode[cur.parent_code] : null;
    }
    return { code: c.code, label: path.join(' > '), level: c.level||1 };
  });
}

// 当前用户可管理品类：admin → null(全部)；pm → 品类数组；user → []（无编辑能力）
function myCats(){
  const r = CURRENT_USER ? CURRENT_USER.role : '';
  if(r === 'admin') return null;
  if(r === 'pm'){
    const s = String(CURRENT_USER.cats || '').trim();
    return s ? s.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean) : [];
  }
  return [];
}
// 当前用户的地区组：CDC（仅澳新）/ CDI（除澳新外）/ null（admin 无限制）
function myRegionGroup(){
  const r = CURRENT_USER ? CURRENT_USER.role : '';
  if(r === 'admin') return null;
  if(r === 'pm') return (CURRENT_USER.region_group || '').trim() || null;
  return null;
}
// 当前用户是否可编辑指定地区的车型
function canEditRegion(region){
  const rg = myRegionGroup();
  if(!rg) return true; // admin 或未设置地区组的 pm 无限制
  const regions = String(region || '').split(',').map(s=>s.trim()).filter(Boolean);
  if(!regions.length) return false;
  if(rg === 'CDC') return regions.includes('澳新地区');
  if(rg === 'CDI') return regions.some(r => r !== '澳新地区');
  return true;
}
// 产品编辑页：根据地区组限制 efRegion 下拉选项
function setupEditRegionFilter(){
  const inp = document.getElementById('efRegion');
  if(!inp) return;
  const rg = myRegionGroup();
  if(!rg) return; // admin 无限制
  
  if(rg === 'CDC'){
    // 强制设为澳新地区，禁用编辑
    inp.value = '澳新地区';
    inp.disabled = true;
    const wrap = inp.closest('.filter-input-wrap');
    if(wrap) wrap.classList.add('has-value');
  }
  // CDI 用户：通过 onFilterChange 时的服务端过滤来实现（见下方）
}
// 产品是否在当前用户可管理品类内（admin 恒 true）
function inMyCats(grp){
  const mc = myCats();
  if(mc === null) return true;
  const g = String(grp||'').trim().toUpperCase();
  if(mc.indexOf(g) >= 0) return true;
  // 父项继承：检查该品类的所有祖先是否在配置列表中
  // 例如 grp=A1，检查 A 是否在 mc 中；grp=B2，检查 B 是否在 mc 中
  for(let i = g.length - 1; i >= 1; i--){
    const parent = g.substring(0, i);
    if(mc.indexOf(parent) >= 0) return true;
  }
  return false;
}
// 生成品类多选 checkbox（selected: 已选品类数组）
function renderUmCatChecks(boxId, selected){
  const box = document.getElementById(boxId); if(!box) return;
  const sel = new Set((selected || []).map(x=>String(x).trim().toUpperCase()));
  if(!CATS || !CATS.length){ box.innerHTML = '<div class="ptree-none">暂无品类</div>'; return; }
  // 只取顶层一级品类（level===1，无 parent_code）
  const tops = CATS.filter(c => !c.parent_code);
  box.innerHTML = tops.map(c => {
    const checked = sel.has(c.code.toUpperCase());
    const label = c.cn ? esc(c.cn) : (c.en ? esc(c.en) : '（未命名）');
    return `<label class="ucat-cat lv1${checked?' ck':''}">
      <input type="checkbox" value="${esc(c.code)}" ${checked?'checked':''}>
      <span class="ucat-label">${esc(c.code)} · ${label}</span>
    </label>`;
  }).join('');
  box.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', function(){
      this.closest('.ucat-cat').classList.toggle('ck', this.checked);
    });
  });
}


function collectUmCatChecks(boxId){
  const box = document.getElementById(boxId); if(!box) return [];
  return Array.from(box.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
}
// 权限下拉联动：产品经理时显示管理品类选择并默认全选
function umOnRoleChange(kind){
  const isNew = (kind === 'new');
  const roleSel = document.getElementById(isNew ? 'umNewRole' : 'umEditRole');
  const box  = document.getElementById(isNew ? 'umNewCatsBox' : 'umEditCatsBox');
  const inner = document.getElementById(isNew ? 'umNewCats' : 'umEditCats');
  const rbox = document.getElementById(isNew ? 'umNewRegionBox' : 'umEditRegionBox');
  if(!roleSel || !box) return;
  const role = roleSel.value;
  const isPm = (role === 'pm');
  box.style.display = isPm ? '' : 'none';
  if(rbox) rbox.style.display = isPm ? '' : 'none';
  if(isPm && inner && !inner.querySelector('input')){
    renderUmCatChecks(isNew ? 'umNewCats' : 'umEditCats', getPmCatOptions().map(o=>o.code));
  }
}
// 页面初始化：新增用户卡片的品类选择默认全选，并按当前权限显示/隐藏
(function(){
  renderUmCatChecks('umNewCats', getPmCatOptions().map(o=>o.code));
  umOnRoleChange('new');
})();

function showGate(show){
  document.getElementById('loginGate').classList.toggle('show', !!show);
  document.getElementById('appLayout').style.display = show ? 'none' : '';
}

async function checkAuth(){
  try{
    const r = await fetch('/api/me');
    const d = await r.json();
    if(d && d.ok && d.user){ CURRENT_USER = d.user; afterLogin(); return; }
  }catch(e){}
  showGate(true);
}

function afterLogin(){
  showGate(false);
  document.getElementById('suName').textContent = CURRENT_USER.username;
  document.getElementById('suRole').textContent = ROLE_NAMES[CURRENT_USER.role] || CURRENT_USER.role;
  applyRoleMenu(CURRENT_USER.role);
  bootstrap();
  loadProdTree();
}

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  if(!u || !p){ err.textContent = '请输入用户名/邮箱和密码'; return; }
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({login:u, password:p})});
    const d = await r.json();
    if(d && d.ok && d.user){
      CURRENT_USER = d.user;
      document.getElementById('loginPass').value = '';
      afterLogin();
    }else{
      err.textContent = (d && d.error) || '登录失败';
    }
  }catch(e){ err.textContent = '网络错误：' + e.message; }
}

async function doLogout(){
  try{ await fetch('/api/logout', {method:'POST'}); }catch(e){}
  CURRENT_USER = null;
  showGate(true);
}

// 账号设置：当前用户修改自己的邮箱/密码
function openAccountSettings(){
  if(!CURRENT_USER) return;
  document.getElementById('accName').value = CURRENT_USER.username || '';
  document.getElementById('accEmail').value = CURRENT_USER.email || '';
  document.getElementById('accPass').value = '';
  document.getElementById('accPass2').value = '';
  document.getElementById('accCurrent').value = '';
  const m = document.getElementById('accMsg'); m.className='um-msg'; m.textContent='';
  document.getElementById('accountModal').classList.add('show');
}
function closeAccountSettings(){ document.getElementById('accountModal').classList.remove('show'); }
async function saveAccountSettings(){
  const msg = document.getElementById('accMsg'); msg.className='um-msg'; msg.textContent='';
  const email = document.getElementById('accEmail').value.trim();
  const pw = document.getElementById('accPass').value;
  const pw2 = document.getElementById('accPass2').value;
  const cur = document.getElementById('accCurrent').value;
  if(!cur){ msg.className='um-msg err'; msg.textContent='请输入当前密码'; return; }
  const body = { current_password: cur };
  if(email !== (CURRENT_USER.email || '')) body.email = email;
  if(pw){
    if(pw !== pw2){ msg.className='um-msg err'; msg.textContent='两次输入的新密码不一致'; return; }
    body.password = pw;
  }
  if(!body.email && !body.password){ msg.className='um-msg err'; msg.textContent='没有需要修改的内容'; return; }
  try{
    const r = await fetch('/api/me', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(d.ok){
      CURRENT_USER = d.user;
      document.getElementById('suName').textContent = CURRENT_USER.username;
      document.getElementById('suRole').textContent = ROLE_NAMES[CURRENT_USER.role] || CURRENT_USER.role;
      msg.className='um-msg ok'; msg.textContent='保存成功';
      setTimeout(closeAccountSettings, 800);
    }else{ msg.className='um-msg err'; msg.textContent = d.error || '保存失败'; }
  }catch(e){ msg.className='um-msg err'; msg.textContent='网络错误：'+e.message; }
}

// 按角色控制菜单：user=查询；pm=查询+编辑；admin=全部（含用户管理）

}

// ================= 用户管理（管理员） =================
let USERS_CACHE = [];
async function loadUsers(){
  const wrap = document.getElementById('umListWrap');
  if(wrap) wrap.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch('/api/users');
    const d = await r.json();
    if(!d.ok){ if(wrap) wrap.innerHTML = `<div class="um-msg err">${esc(d.error||'加载失败')}</div>`; return; }
    USERS_CACHE = d.users || [];
    renderUsers();
  }catch(e){ if(wrap) wrap.innerHTML = `<div class="um-msg err">网络错误：${esc(e.message)}</div>`; }
}

function renderUsers(){
  const wrap = document.getElementById('umListWrap');
  if(!wrap) return;
  if(!USERS_CACHE.length){ wrap.innerHTML = '<div class="empty">暂无用户</div>'; return; }
  let h = '<table class="um-table"><thead><tr><th>用户名</th><th>邮箱</th><th>权限</th><th>管理品类</th><th>地区组</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  USERS_CACHE.forEach(u => {
    const isSelf = CURRENT_USER && CURRENT_USER.username === u.username;
    h += `<tr>
      <td>${esc(u.username)}${isSelf?' <span class="dim">(我)</span>':''}</td>
      <td>${esc(u.email||'—')}</td>
      <td><span class="um-role ${u.role}">${ROLE_NAMES[u.role]||u.role}</span></td>
      <td>${u.role==='pm' && u.cats ? (function(){const all=String(u.cats).split(',').map(c=>c.trim().toUpperCase()).filter(Boolean);const top=all.filter(c=>!all.some(o=>o!==c&&c.startsWith(o)&&c.length>o.length));const byCode={};(typeof CATS!=='undefined'?CATS:[]).forEach(c=>{byCode[c.code.toUpperCase()]=c});return top.map(c=>{const cat=byCode[c];return `<span class="um-cat-tag">${esc(c)}${cat?' '+esc(cat.cn||''):''}</span>`}).join('')||'—'})() : '—'}</td>
      <td>${u.role==='pm' && u.region_group ? '<span class="um-cat-tag">'+esc(u.region_group)+'</span>' : '—'}</td>
      <td>${u.active?'<span class="um-on">启用</span>':'<span class="um-off">停用</span>'}</td>
      <td class="pm-ops">
        <button class="ghost btn sm" onclick="umEditUser(${u.id})">编辑</button>
        <button class="ghost btn sm" onclick="umToggleActive(${u.id},${u.active?0:1})">${u.active?'停用':'启用'}</button>
        <button class="ghost btn sm" ${isSelf?'disabled':''} onclick="umDeleteUser(${u.id})">删除</button>
      </td>
    </tr>`;
  });
  h += '</tbody></table>';
  wrap.innerHTML = h;
}

async function umAddUser(){
  const msg = document.getElementById('umAddMsg'); msg.className='um-msg'; msg.textContent='';
  const role = document.getElementById('umNewRole').value;
  const body = {
    username: document.getElementById('umNewName').value.trim(),
    email: document.getElementById('umNewEmail').value.trim(),
    password: document.getElementById('umNewPass').value,
    role
  };
  if(role === 'pm'){
    body.cats = collectUmCatChecks('umNewCats');
    if(!body.cats.length){ msg.className='um-msg err'; msg.textContent='请为产品经理至少选择一个管理品类'; return; }
    body.region_group = document.getElementById('umNewRegionGroup').value;
    if(!body.region_group){ msg.className='um-msg err'; msg.textContent='请为产品经理选择地区组（CDC/CDI）'; return; }
  }
  if(!body.username){ msg.className='um-msg err'; msg.textContent='请输入用户名'; return; }
  if(!body.password){ msg.className='um-msg err'; msg.textContent='请输入初始密码'; return; }
  try{
    const r = await fetch('/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(d.ok){
      msg.className='um-msg ok'; msg.textContent='已新增用户';
      document.getElementById('umNewName').value=''; document.getElementById('umNewEmail').value=''; document.getElementById('umNewPass').value='';
      document.getElementById('umNewRole').value='user';
      const rgSel = document.getElementById('umNewRegionGroup');
      if(rgSel) rgSel.value='';
      renderUmCatChecks('umNewCats', getPmCatOptions().map(o=>o.code));
      umOnRoleChange('new');
      loadUsers();
    } else { msg.className='um-msg err'; msg.textContent=d.error||'新增失败'; }
  }catch(e){ msg.className='um-msg err'; msg.textContent='网络错误：'+e.message; }
}

let UM_EDIT_ID = null;
function umEditUser(id){
  const u = USERS_CACHE.find(x=>x.id===id); if(!u) return;
  UM_EDIT_ID = id;
  document.getElementById('umEditTitle').textContent = '编辑用户：' + u.username;
  document.getElementById('umEditName').value = u.username;
  document.getElementById('umEditEmail').value = u.email||'';
  document.getElementById('umEditRole').value = u.role;
  renderUmCatChecks('umEditCats', String(u.cats||'').split(','));
  const rgSel = document.getElementById('umEditRegionGroup');
  if(rgSel) rgSel.value = u.region_group || '';
  umOnRoleChange('edit');
  document.getElementById('umEditPass').value = '';
  const m = document.getElementById('umEditMsg'); m.className='um-msg'; m.textContent='';
  document.getElementById('umEditModal').classList.add('show');
}
function umHideEdit(){ document.getElementById('umEditModal').classList.remove('show'); UM_EDIT_ID=null; }
async function umSaveEdit(){
  const msg = document.getElementById('umEditMsg'); msg.className='um-msg'; msg.textContent='';
  const role = document.getElementById('umEditRole').value;
  const body = { id: UM_EDIT_ID, email: document.getElementById('umEditEmail').value.trim(), role };
  if(role === 'pm'){
    body.cats = collectUmCatChecks('umEditCats');
    if(!body.cats.length){ msg.className='um-msg err'; msg.textContent='请为产品经理至少选择一个管理品类'; return; }
    body.region_group = document.getElementById('umEditRegionGroup').value;
    if(!body.region_group){ msg.className='um-msg err'; msg.textContent='请为产品经理选择地区组（CDC/CDI）'; return; }
  }
  const pw = document.getElementById('umEditPass').value;
  if(pw) body.password = pw;
  try{
    const r = await fetch('/api/users', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(d.ok){ umHideEdit(); loadUsers(); }
    else { msg.className='um-msg err'; msg.textContent = d.error||'保存失败'; }
  }catch(e){ msg.className='um-msg err'; msg.textContent='网络错误：'+e.message; }
}

async function umToggleActive(id, active){
  try{
    const r = await fetch('/api/users', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, active})});
    const d = await r.json();
    if(d.ok) loadUsers(); else umSetMsg(d.error||'操作失败', true);
  }catch(e){ umSetMsg('网络错误：'+e.message, true); }
}

async function umDeleteUser(id){
  if(!confirm('确定删除该用户？此操作不可恢复。')) return;
  try{
    const r = await fetch('/api/users', {method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
    const d = await r.json();
    if(d.ok) loadUsers(); else umSetMsg(d.error||'删除失败', true);
  }catch(e){ umSetMsg('网络错误：'+e.message, true); }
}

function umSetMsg(t, isErr){ const m=document.getElementById('umMsg'); if(m){ m.className='um-msg '+(isErr?'err':'ok'); m.textContent=t; } }

// 启动：先校验登录态；未登录则停留在登录门
checkAuth();
</script>
